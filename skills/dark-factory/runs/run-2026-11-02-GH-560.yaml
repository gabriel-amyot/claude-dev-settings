improvements:
  - rank: 1
    title: "Pass and persist tdd_violations for every HALT_TDD_GATE"
    detail: >
      In dark-factory.workflow.js, when the Implement or Fix gate returns HALT_TDD_GATE, write
      the violations array to <ticket>/tdd/gate-violations.json and add it to the Retro prompt
      as tdd_violations. Contract 9 must then require a halt_cause line quoted from that array.
      This item is already in improvements/QUEUE.yaml. It has now cost a third retro its root cause.
  - rank: 2
    title: "Add an evidence ac_kind and route it to doc_claims"
    detail: >
      Contract 1 (concierge/analyst) must tag an AC whose text is "capture", "verify after
      deploy" or "distinguish evidence" as ac_kind evidence, not logic. tddViolations() must
      accept an evidence AC only with a doc_claims array where each claim points at a passing
      test or log. Add a tests/tdd-gate.test.mjs case built from GH-560 AC-4.
  - rank: 3
    title: "Pre-gate RED-feasibility check at grill"
    detail: >
      Contract 3 must emit, per AC, red_feasible true or false with a reason. The workflow must
      refuse to start Implement when an AC is red_feasible false and has no planned exemption
      shape. This moves the gate from after implement to before it.
  - rank: 4
    title: "Make grill parked items a gate input"
    detail: >
      Grill returns parked items as a machine-readable list with a pattern signature (for
      GH-560, ScriptUtils|ClassPathResource). Before Review, grep the diff for each signature.
      A hit without args.accepted_parked[<id>] sets status BLOCKED_NEEDS_HUMAN with the item.
  - rank: 5
    title: "Java belt toolchain and tool preflight"
    detail: >
      The java belt must run a preflight in concierge: resolve a JDK that matches
      maven.compiler.release or source (pinned cache path allowed), and check pmd on PATH.
      Record the outcome in the run trace. Either allow the pinned JDK cache explicitly in the
      contract or block at concierge. Do not let implement decide.
  - rank: 6
    title: "Clean up phase worktrees"
    detail: >
      Design and grill phases that create a worktree must remove it before returning, or the
      workflow must run git worktree remove on every path a phase reports. GH-560 left
      /Users/gamyot/.cache/um-gh560-design.
  - rank: 7
    title: "Audit runs/ against CHANGELOG"
    detail: >
      Add a check that every run cited in CHANGELOG.md has a YAML in runs/ and an INDEX.md
      line. Two cited runs (KTP-1003 2026-10-07, GH-342 2026-10-16) have no file.

