summary: >
  The strongest build the factory has produced, halted correctly on an honest gap, on a branch that
  never left the laptop. The rebuild against AC-LOCAL.md worked: four ACs, a clean STUB/RED/GREEN chain
  on all four, 382 green tests, a real 28.9 MB bundle that QA rebuilt and hand-verified, a review with
  executable probes, and a QA that refused to round AC-3 up to PASS when its substitute proof was
  value-agnostic. Two ACs fall short for real reasons — a refused Auth0 credential is classified
  'upstream' instead of 'credential', and the named secret-value grep needs a human 1Password sign-in.
  The structural failure is elsewhere: the push to origin failed with a 502, no gate checks git for the
  push, and Review and QA both fell back to a local ref instead of stopping. Sixteen commits and every
  proof in this run exist on one machine.
