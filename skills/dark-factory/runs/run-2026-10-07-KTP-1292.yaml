  Create the MR for KTP-1292-drop-unwindowed-ad-group-spend into dev and post the Jira comment.
  The comment must state plainly that the spend figure was dropped rather than labelled, that
  AC-1 and AC-3 are therefore vacuous, and that they become live only if a window for
  AdGroupSpend.spend is ever established. That is a product-visible behaviour change on
