improvements:
  - title: "Make a grill 'operator decision' gap a hard stop before implement"
    detail: >
      Contract 3 already emits a verdict of partial with labelled gaps. Add a field,
      operator_decision_required, as a list of gap ids. workflow.js must halt with
      BLOCKED_NEEDS_HUMAN when that list is non-empty, and print the gap body, rather than
      passing it to implement as prose. G1 here was correct, early, and ignored, and that
      cost a full build cycle.
  - title: "Add a reachability assertion to the AC schema and to contract 6"
    detail: >
      For any AC that emits, writes or exposes something a user or a downstream system
      consumes, require a reachability_proof field naming the entry point the shipped
      default configuration actually takes, plus the env var or flag that selects it. QA may
      not return PASS on such an AC without it. That would have caught USE_DEEP_AGENT
      defaults true at design time, not after 228 green tests.
  - title: "Give the review gate a severity lever, not only demonstrated true or false"
    detail: >
      criticals_open should count HIGH findings with demonstrated false that carry a
      note_for_the_human, not only demonstrated ones. Route those to a human_rulings list
      that the pre-ship contract must see as empty before it opens an MR. Today a HIGH that
      cannot be expressed as a failing test is invisible to the gate.
  - title: "Add the PUSHED_AWAITING_MR terminal state and stop filing it as a halt"
    detail: >
      Fourth run in a row. workflow.js should detect, at the pre-ship boundary, that the
      branch exists on the remote and is in sync, and emit PUSHED_AWAITING_MR with the
      branch ref, rather than HALT_PRESHIP. The main loop then has an unambiguous handle for
      the MR plus report-back step, and the telemetry stops conflating a dead run with a
      finished one.
  - title: "Fail the run when an AC contradicts the code it was written against"
    detail: >
      Contract 2 or 3 should run an explicit AC-vs-code consistency check for every symbol
      an AC names, with git show against the base ref. A miss, like AC-5's note pointing at
      confirm_output and routing on MediaPlanDeepState, must return the AC to its author
      instead of becoming a build-time judgement call. The analyst note F6 was already known
      wrong at grill time, by the same mechanism.
  - title: "Forbid the build from editing an assertion that judges it"
    detail: >
      Add an implement-phase check: if a commit changes a test that encodes an AC's own
      boundary, such as the AC-5 file allowlist, the run must record an ac_amendment entry
      with the reason and surface it in the QA report as a distinct field, not as a buried
      deviation_noted. QA accepted the uv.lock widening on the merits, which is fine, but it
      should not be the only place the amendment is visible.
  - title: "Wire a wayfinder close-out into the pre-ship contract"
    detail: >
      For any run whose source is github, the pre-ship step must post a comment on the
      source issue carrying the branch, the head sha, the per-AC QA verdicts and any open
      human ruling, even when the run halts. Issue 299 has zero comments after a complete
      build, so the map would re-dispatch this patch.
  - title: "Require a follow-up record for accepted defects"
    detail: >
      When review or QA accepts a defect, the race on _approved_emitted and its unbounded
      growth here, the run must emit a deferred_defects list that the close-out comment
      prints. Accepted is not the same as recorded, and today it is recorded only inside a
      JSON file in a ticket folder.

summary: >
  A technically clean, genuinely test-first run that built the wrong-reachable thing. Nine
  commits, four verified RED to GREEN pairs, 228 tests green, nothing under src/ moved, and
  the branch is pushed and in sync at 831fa90. It still ends at 65 on task confidence,
  because the event does not fire on the path production takes, the dedupe mechanism is not
  the one the AC specifies, and no merge request or map report-back exists. The factory
  knew the reachability problem at grill time and had no gate able to stop on it.
