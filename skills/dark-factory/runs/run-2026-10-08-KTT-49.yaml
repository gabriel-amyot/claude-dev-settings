improvements:
  - title: "Forward tdd_violations into the retro prompt"
    detail: >
      workflow.js line 1284 builds the retro prompt with tddGateMode and tddWarnings only. Add
      result.tdd_violations. One line: append
      "Halt-mode TDD violations: ${JSON.stringify(result.tdd_violations || [])}." A retro that cannot
      name the violation that stopped the run produces a reconstruction, and reconstructions are
      exactly the unstamped verdicts the house rules forbid. This run spent most of its budget
      reverse-engineering a string the runtime already had in hand.
  - title: "Never isolate a Workflow phase inside project-management"
    detail: >
      The runtime created .claude/worktrees/wf_f1bd81db-ec8-4 plus branch worktree-wf_f1bd81db-ec8-4
      in a repo whose CLAUDE.md declares a single trunk and forbids both operations. Add a hard
      precondition to the agent() helper, or to the isolation:'worktree' call site: if the resolved
      isolation root is the project-management checkout, refuse and run in place. Ticket artifacts
      belong on main, where the next session and the human both look.
  - title: "Recover the stranded KTT-49 evidence and prune the three stray worktrees"
    detail: >
      Cherry-pick or copy tickets/KTT/no-epic/KTT-49/tdd/, review/diff.patch,
      review/diff-dac-gcp-back-biag.patch and reports/implementation/build-result.md from branch
      worktree-wf_f1bd81db-ec8-4 onto main, update the ticket INDEX.md to list them, then
      git worktree remove the three .claude/worktrees entries and delete their branches. Do this before
      the next factory run, because a later git clean in that repo deletes the only copy.
  - title: "Give the TDD gate a first-class infrastructure exemption"
    detail: >
      Add infra_declarative(<why>) alongside not_applicable, infra_blocked and doc_claims. It applies
      when the deliverable is declarative configuration with no executable unit surface (HCL, a k8s
      manifest, a CI template). Make it carry its own cheap proof list in the same shape doc_claims
      uses: each entry names a static check actually run, such as terraform fmt -check -diff, a diff
      assertion that a forbidden file is byte-identical to origin, or a grep proving no credential
      literal is present. KTT-49's AC-6 ledger already ran exactly four such checks by hand, so the
      evidence shape exists and only the schema slot is missing.
  - title: "Make the exemption router read a deliverable list, not one string"
    detail: >
      AC-6 ships two deliverables: committed HCL and an un-committed markdown proposal. The doc-shape
      router inspects a single deliverable string, so a mixed AC either hides its document or trips a
      router written for contract pages. Change deliverable to an array and apply the doc_claims rule
      only when EVERY deliverable is a document.
  - title: "Mark production-gated ACs in the schema and short-circuit them"
    detail: >
      Add a per-AC field, for example completable_by_factory: false with a reason, written by the
      concierge. The TDD gate skips those ACs outright instead of requiring prose in ac-list.json to
      be re-read by every phase, and the concierge can tell the human up front that a run covering
      three of six ACs is the best available outcome. KTT-49 knew this at phase 1 and still ran a full
      pass.
  - title: "Push after the TDD gate, not before"
    detail: >
      Implement currently pushes both branches and then the gate halts, so a failed run publishes
      unreviewed branches. Either move the push to after the gate clears, or make the halt path report
      the pushed branch names as cleanup work in the handoff so nothing is left orphaned on the remote.
  - title: "Turn a reproduced pre-existing failure into a filed ticket"
    detail: >
      Implement correctly reproduced three test_demo_data failures at merge base ca3108c and correctly
      declined to fix them. Nothing records them anywhere a human will see. Require the implement
      contract to emit a pre_existing_failures array (test id, merge-base sha, one-line symptom) and
      have the ship or retro phase write it to the inbox at general/inboxes/gabriel/pending/.
  - title: "Clean up design-gate scratch artifacts in shared SaaS"
    detail: >
      The design proof created LangSmith project ktt49-design-proof inside the shared production
      workspace and left it. When a design gate writes into a shared external system, the contract
      should require a named teardown step, or a scratch workspace, before the phase returns.
  - title: "Bounce a grill gap back to design when it changes the plan"
    detail: >
      Grill produced ten gaps and forwarded nine to implement as a work list. G-A, G-B and G-C are
      design changes (a consent call, failure-event subscription with buffer bounding, a crew-identity
      key), not implementation details. Let grill mark a gap as design_rework and return that subset to
      phase 2, so implement is not absorbing design debt on top of a two-repo build.

