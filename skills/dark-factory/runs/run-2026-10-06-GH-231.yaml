ac5_wording_mismatch:
  severity: the one substantive AC gap in the run
  detail: >
    AC-5 words ONE request for the viewport. CENSUS_MAX_IDS_PER_REQUEST is 2000 while
    use-census-choropleth paints up to CENSUS_MAX_FEATURES = 4000 (census-layer.ts:43), so a
    viewport of 2001 to 4000 ZIPs costs TWO SEQUENTIAL requests and pays two latencies. The
    review demonstrated it (review/probes, case P5) and labelled it LOW because AC-5's intent,
    not one per prefix and not one per ZIP, is met. Both are defensible. What is not defensible
    is that an AC the run reports as proven is, at the cap, literally not what the AC says, and
    nothing in the pipeline forced that to be either fixed or renegotiated before the retro.

