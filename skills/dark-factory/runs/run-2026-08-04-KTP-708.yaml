improvements:
  - title: "On BLOCKED_SPEC_QUALITY, auto-draft the owner reply and route it to /post-comment (promote from proposal to gate change — third recurrence)"
    detail: >
      The terminal handler for BLOCKED_SPEC_QUALITY should compose a Jira reply from the analyst
      artifacts and hand it to /post-comment for human-gated posting. KTP-708 is the sharpest case:
      Rajan asked 'Share more info / create a spike if needed' on 2026-07-27, and the concierge's
      verified findings (sandbox cred exists, no bid-write production token located, no repo home,
      zero ACs, money-moving risk) ARE the answer — sitting invisible on disk. Also drop a pending/
      item in general/inboxes/gabriel/ so the decision enters the human queue. Proposed in the
      KTP-762 and KTP-746 retros; unwired both times.
  - title: "Pre-dispatch triage: refuse concierge entry when the ticket has zero AC-shaped content or an unanswered owner question proposing a spike/split"
    detail: >
      workflow.js, at concierge entry: (1) scan the Jira description + AC-LOCAL.md for AC-shaped
      content (Given/When/Then, bullet criteria, or a jira/ac/ folder) — zero hits routes to a
      spec/spike queue, not the build line; (2) scan the newest comments for an unanswered TL/PO
      question ('create a spike', 'share more info', 'split this') — an unanswered one blocks
      dispatch with a pointer. Five concierge cycles (KTP-699 x2, KTP-762, KTP-746, KTP-708) have
      now been spent confirming halts these signals already implied.
  - title: "Concierge must classify spike-shaped tickets and recommend the spike track, not just FAIL"
    detail: >
      KTP-708's shape — greenfield vendor WRITE API, no repo home, no production credential,
      unspecified guardrails on money-moving operations — is a research/spike deliverable, exactly
      what Rajan proposed. Add a concierge output field verdict: BUILDABLE | SPIKE_SHAPED |
      DECISION_GATED; on SPIKE_SHAPED, name the track (/api-spike for the TTD sandbox: auth against
      the 1Password sandbox login, enumerate ad-group read + bid-write endpoints, document scopes
      needed for the Powers seat) so the halt hands the human a next action instead of a bare FAIL.
  - title: "Persist a single open-questions.json (and the ticket-init scaffold) whenever the concierge blocks"
    detail: >
      Q2 (repo/surface home) and Q3 (production bid-write credential) exist only as cross-references
      inside assumptions.json and affected-repos.json; a Q1 is implied by numbering but nowhere
      enumerated. On any blocking terminal, the concierge must write analyst/open-questions.json
      ({id, question, owner, blocking: true/false}) and run the ticket-init scaffold (README,
      reports/ tree) so the re-entry check ('are the open_questions answered?') proposed in the
      KTP-699 retro has a deterministic file to read.
  - title: "Carry the ticket folder through the orchestrator trace to Retro"
    detail: >
      The concierge created tickets/KTP/KTP-3/KTP-708/ but the retro prompt received 'Ticket
      folder: (unresolved)'. The workflow should propagate the concierge's resolved ticket_folder
      output into the shared run state so later phases (and this retro) receive it instead of
      re-deriving it by filesystem search.
  - title: "Fix the empty session_id so retro handoffs land in a per-session prompts folder"
    detail: >
      Fifth run flagged (2026-06-11, 2026-06-22, 2026-07-13, 2026-08-03, 2026-08-04):
      sessions/active/state.yaml session_id is empty while the live id sits in current_focus.
      Repair the session-init/state-write step, or have Retro derive the session from
      current_focus, so handoffs are discoverable by /session:pickup instead of falling back to
      ticket reports/.

