# Gitleaks config for the harness repo.
#
# Extends the default ruleset. Every allowlist entry below is a reviewed
# false positive. Do not add a path here to silence a real credential.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  # The ledger CLI takes `--key <handoff-filename>` to address a ledger entry.
  # Its eval suite passes values like '2026-07-30-eval.md', which match the
  # generic-api-key rule on the word "key" alone. No credential is involved.
  paths = [
    '''plugins/local-marketplace-backup/session/bin/evals/test_ledger\.py''',
    '''plugins/local-marketplace/session/bin/evals/test_ledger\.py''',
  ]
