improvements:
  - title: "Make findings_artifact a FILE check, not a string check, in workflow.js"
    detail: >
      dark-factory.workflow.js has no existsSync/readFileSync at all. Add a post-return validator on
      the review phase: resolve findings_artifact, assert the file exists, assert it parses as JSON,
      and assert its findings array length matches the returned findings length. On failure, fail the
      gate and re-dispatch the reviewer with the miss quoted. This defect has now cost four-plus runs
      (KTP-784 x3, KTP-1020, KTP-1062) and each retro wrote the same prose fix. Prose does not stick;
      the same lesson that made ac_tdd stick applies here. Apply the identical check to
      qa/result.yaml.
  - title: "QA's artifact spot-check must gate, not annotate"
    detail: >
      Contract 6 tells QA to confirm review/findings.json exists and is non-empty. On KTP-1062 QA
      confirmed it does NOT exist and returned ALL_PASS anyway. Change contract 6 so a failed
      artifact spot-check forces raw_overall != ALL_PASS with partial_cause "review artifact missing",
      and add a workflow.js assertion that rejects the pair (review_artifact_spotcheck.present=false,
      raw_overall=ALL_PASS). A ground-truth layer that only annotates is not a layer.
  - title: "Add a PROVISIONAL_RULING terminal (or mandatory ratification artifact) for machine-answered concierge questions"
    detail: >
      When the concierge answers its own gate question and marks it
      status: provisional-needs-ratification on a real architecture call, READY_TO_SHIP is too clean a
      terminal. Contract 1 should require that any provisional answer emits (1) a
      general/inboxes/gabriel/pending/ file with the question, the ruling, the reasoning and the
      transfer path if overturned, plus an INDEX.md refresh, and (2) a PROVISIONAL RULING banner in
      the MR description. Q1 on KTP-1062 (new route versus restricting the passthrough, contradicting
      both the ratified plan and the spike conclusion) is exactly the class that must not merge on a
      machine's own say-so.
  - title: "Ship-prep must discharge the deferred-AC obligations it recorded, not just record them"
    detail: >
      STATUS_SNAPSHOT.yaml listed 'post the deferred-AC question to Jira' and 'create the inbox item'
      as outstanding human actions, the grill carried the same as G7, and both were dropped. Contract
      8 (ship-prep) should scan the ticket folder for deferred/provisional/needs-input markers and
      refuse READY_TO_SHIP until each has either a drafted Jira comment queued for /post-comment or a
      pending inbox file on disk. The project CLAUDE.md already forbids the phrase 'needs PO input'
      existing on disk without a matching Jira comment; the factory should enforce its own house rule.
  - title: "Every terminal phase writes the front-loaders back"
    detail: >
      README.md said 'Implementation: Not started' and STATUS_SNAPSHOT.yaml said
      implementation_started: false with 11 commits pushed. Add a small ship-prep step (or a
      workflow.js post-terminal hook) that rewrites factory_phase, implementation_started, branch,
      head sha, and the artifact list from the run trace. These files are the documented recovery save
      point; a resuming agent reading them today would redo finished work.
  - title: "Turn QA's observations_not_ac_failures into real follow-ups"
    detail: >
      QA wrote a precise, actionable defect (null variables forwarded into the library NPE, live
      HTTP 500, and 'the Powers MCP will hit it the first time it sends a document with no variables')
      and it died in a YAML field. Contract 6 should require each entry in
      observations_not_ac_failures to carry a disposition: guard-it-now, follow-up-ticket-drafted, or
      accepted-with-reason. Ship-prep surfaces any drafted follow-up in the MR description.
  - title: "Repair the empty session_id once, at the source"
    detail: >
      Flagged on KTP-1030, KTP-708, KTP-1020 and now KTP-1062: sessions/active/state.yaml session_id
      is empty while the live id sits inside the current_focus JSON blob. Either fix the session-init
      write, or have contract 9 parse current_focus and resolve the per-session prompts folder itself.
      Four consecutive retros writing the same line is the signal that this needs a code fix, not
      another note.

