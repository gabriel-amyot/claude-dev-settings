improvements:
  - title: "Contract 7 (review/fix loop): the carried-findings record must be verified against the fix-pass outcome before commit"
    detail: >
      The fix loop should re-read each carried finding after the pass that claims to fix it and
      update the record in the same commit (finding id → fixed_in_pass, evidence line). A record
      that says 'carried' for a finding the diff fixed is a false artifact; this run needed a
      manual correction commit (20f8187c) to repair it.
  - title: "Add a model-facing token-budget check to design/grill for MCP-server tickets"
    detail: >
      When the primary repo serves @mcp.tool descriptions, design must state the baseline served
      chars, the projected head chars, and a budget. Grill fails the plan if growth is unbudgeted.
      The AST-extraction snippet in reports/architecture/2026-09-12-mcp-tool-prompt-adversarial-review.md
      is reusable as the measurement tool.
  - title: "Contract 8 (QA): a skipped test count > 0 requires a skip inventory line"
    detail: >
      QA must not report ALL_PASS on a suite with skips unless qa/ contains one line per skip
      group (marker/reason) and an assertion that no skip covers a changed surface. 634/21 here is
      almost certainly fine, but 'almost certainly' is exactly what the artifact should remove.
  - title: "Route phase artifacts to the canonical ticket subfolders (review/, tdd/) or delete them from the scaffold"
    detail: >
      Either the review contract writes its findings ledger to tickets/.../review/ and the TDD
      gate writes its red/green manifest to tdd/, or ticket-init stops scaffolding folders no
      contract fills. Empty canonical folders next to full non-canonical ones make every
      artifact-existence gate unreliable.
  - title: "Pre-probe wayfinder/library dead-end check in the tool belts"
    detail: >
      Before any exploratory API/tool probe, the belt checks the wayfinder map (and org
      bibliothèque) for a recorded dead end on that route. The list_ad_groups cycle this run was
      spent rediscovering a reportable dead end.
  - title: "Deferred evaluations must leave a tracked follow-up at ship-prep"
    detail: >
      When an AC constraint defers a verification (here: the deterministic model evaluation),
      ship-prep must emit a follow-up item (inbox file or issue) linking the MR and stating what
      remains unproven, so READY_TO_SHIP is never silently read as behaviour-verified.

