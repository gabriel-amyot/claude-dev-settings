improvements:
  - title: "Contract 9: disambiguate the telemetry run id for repeat runs on one ticket"
    detail: >
      The filename rule must be run-<DATE>-<TICKET>[-<slice>].yaml with an explicit
      'if the file exists, append a slice/sequence suffix and never overwrite' clause.
      Two same-day runs on KTP-1182 collided today; the suffix was improvised.
  - title: "Apply or retire the canonical-folder rule (review/, tdd/) — now confirmed twice"
    detail: >
      Same finding as the issue-47 retro, one slice later, still unfixed: either contract 5/6
      (review, TDD gate) write their ledger/manifest into tickets/.../review/ and tdd/, or
      ticket-init stops scaffolding those folders. Two clean runs in a row would fail any
      artifact-existence gate. This is now the top carry-over.
  - title: "Contract 8 (QA): enforce a red->green pairing convention"
    detail: >
      For every AC-N.red.out there must be either an AC-N.out green or one mapping line in a
      qa/PAIRING.md (AC-N -> green artifact + test ids). Grouped greens stay allowed but must be
      claimed explicitly.
  - title: "Platform-reality follow-up: unexecutable target platforms get a tracked item at ship-prep"
    detail: >
      When an AC targets a platform the belt cannot execute (here: Windows LockFileEx and the
      Windows bundle runtime), ship-prep must emit an inbox item / issue linking the MR and
      stating 'unproven on <platform> — run tests/test_sidecar_lock_windows.py and the bundle
      suite on a Windows host before relying on it'. Same shape as the deferred-eval rule from
      the issue-47 retro.
  - title: "Soft-confidence rubric: a non-90 value requires a one-line reason"
    detail: >
      Five phases reported a flat 88 with no stated cause. Each contract's return should require
      confidence_reason when the value deviates from the 90 anchor, so the retro can convert
      confidence into deductions instead of guessing.
  - title: "Gate improvement application: the next run on the same factory must ack the open handoff"
    detail: >
      The concierge should read runs/INDEX.md + the latest dark-factory-improvements-* handoff
      and record which open improvements it applies or defers. Improvement #3 (skip inventory)
      landed this run only because the QA author happened to carry it; #4 (canonical folders)
      silently repeated.

