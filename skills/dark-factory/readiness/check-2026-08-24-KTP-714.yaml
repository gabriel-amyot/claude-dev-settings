correction_note: >
  The first pass of this check recorded AC-1's premise as false and
  unaddressed, and claimed no .mbtiles existed. Both were wrong. The
  cause was reading the code repos exhaustively while never opening
  tickets/KTP/KTP-559/KTP-714/, which already held the runbook, the
  backup manifest and the close-out. Recorded here because a readiness
  check that skips the ticket's own history will keep manufacturing
  false blockers.

policy_note: >
  Even with a vendor-account-ops belt racked, destructive mutation of a
  production vendor account is a candidate for a permanent human gate
  rather than autonomous execution. Deletion has no rollback. Worth
  deciding explicitly rather than by default.

improvement_signal: >
  External-system mutation. Second instance in this check-run alongside
  KTP-694. Both deliverables are state changes in a system outside the
  repo, neither is a spec problem, neither is fixable by refinement.
