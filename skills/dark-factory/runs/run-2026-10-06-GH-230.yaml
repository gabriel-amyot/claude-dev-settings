      a real ZIP like 00501 would have 503-ed the whole request. It wrote the fix as an ADR
      draft. The partial is honest: G6 (inventory read frequency) and G7 (the CacheControl
      number) were left as recommendations with no gate behind them.
  - phase: implement
    status: partial
    confidence: 84
    note: >
      Twenty-one commits, eight ordered AC pairs, all eight ACs covered. G1 was closed in code
