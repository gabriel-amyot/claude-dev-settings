halt_cause: >
  The TDD gate halted after implement. The exact violation strings were NOT available to this retro:
  workflow.js line 1284 forwards only tddWarnings (warn-mode violations, empty by construction when
  the gate runs in halt mode) and never forwards result.tdd_violations. The halt cause is therefore
  reconstructed from the on-disk ledger, not read from the gate.
  Reconstruction. Of the six ACs, only AC-4, AC-5 and AC-6 were in scope. AC-4 and AC-5 both carry a
  well-formed RED/GREEN pair with artifacts (tdd/AC-4-red-output.txt, tdd/AC-5-red-output.txt), so
  neither is a plausible violation. AC-6 is the single exempt entry. Its ledger exempt reads
  not_applicable(terraform HCL: no unit surface, and terraform plan/apply is forbidden by standing
  rule and unreachable from this machine). That string matches the gate's exempt regex, so the
  remaining candidates are the two routers that fire after it: the doc-shape router (an exemption
  whose deliverable ends in .md must use doc_claims, and AC-6's reviewable artifact is
  reports/architecture/ac6-iam-binding-proposal.md), or a completeness violation on an AC marked done
  in ac_progress without a ledger entry. This ambiguity is itself the top finding of the run.

