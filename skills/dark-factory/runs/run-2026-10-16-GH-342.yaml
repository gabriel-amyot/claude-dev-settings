improvements:
  - title: "Pass tdd_violations into the retro prompt"
    detail: >
      In dark-factory.workflow.js, where the retro prompt is built (near line 1284), add
      result.tdd_violations (and result.phase) to the prompt text. Also write them to
      <ticket_folder>/tdd/gate-violations.json at halt time. Raised in KTT-49 and still open.
  - title: "Give baseline_plus_new a gate-accepted proof shape"
    detail: >
      Extend ac_tdd with mutation: { artifact, killed: true, mutant_desc } and let tddViolations()
      accept kind=baseline_plus_new when red.failed is false but a killed mutant is recorded. Update
      contract 4 to describe it. QA layer 2 re-runs the mutant. This keeps teeth and removes the
      false halt.
  - title: "Bounded TDD remediation for non-shape violations"
    detail: >
      When the code is pushed and only a RED proof is missing, bounce once to the implementer in its
      worktree to add a test-only RED (or a mutation proof) for the flagged ACs, then re-gate. Record
      the attempt in the trace like implement-ledger-repair. Keep the hard halt if the retry fails.
  - title: "Track side deliverables as a gated checklist"
    detail: >
      Let design emit side_deliverables [{id, kind, blocks}] and make preship refuse READY_TO_SHIP
      while a deliverable that blocks a shipped flag is open. S1/S2 here block the dev flag.
  - title: "Clean and prevent project-management worktrees"
    detail: >
      Remove the six wf_* worktrees after confirming no unique work, and assert in the workflow
      preamble that no agent with isolation worktree targets project-management.
  - title: "Make phase confidence carry signal"
    detail: >
      Require each phase to deduct from 100 with named reasons (as retro does). A flat 80 everywhere
      should fail schema validation or be flagged by retro automatically.

resume_path: >
  Do not re-run the factory from scratch (it rebuilds from origin/dev). Read the halt result for
