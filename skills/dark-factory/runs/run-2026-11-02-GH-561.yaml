improvements:
  - title: "Contract 5: require a full-surface sweep in review round 1"
    detail: >
      When the diff adds a union type of outcomes (for example TargetingAccess.reason or
      TargetingScope.reason), the first review must enumerate every variant and test the
      user-visible result for each. Record the enumeration in findings.json as surface_sweep. A
      later round may block only on a finding outside the swept surface or on a regression from a
      fix.
  - title: "Contract 3 (grill): flag many-to-one mappings of distinct states to one user message"
    detail: >
      Add a grill check. When the design defines N distinct denial or error reasons and maps them
      to fewer user messages, the grill must ask whether each message is true for every reason it
      covers. D11 would have failed this check.
  - title: "workflow.js: allow one bonus fix round for a converging, small residual"
    detail: >
      If each previous fix round cleared its blocking set, the residual set has no CRITICAL or HIGH,
      and every residual finding carries a test_ref the fixer can adopt, run one extra fix round
      before returning the blocked status. Cap the total at 3. Record the bonus round in the trace.
  - title: "workflow.js: rename the review terminal status by the rule that fired"
    detail: >
      Return BLOCKED_REVIEW_CRITICAL only when a CRITICAL is open. Return BLOCKED_REVIEW_DEMONSTRATED
      when the block comes from a demonstrated non-critical finding. describeBlocking() already
      splits the reasons, so reuse its classification for the status name.
  - title: "Frontend belt: add a client component test harness"
    detail: >
      Add a jsdom-based runner (or a Next-free render helper) to the frontend tool belt so the
      reviewer and the tester can render client components that use router and context hooks.
      This turns source assertions on wiring into behavior tests.
  - title: "Retro prompt: pass the blocking findings and the findings path"
    detail: >
      Include blocking_findings, fix_rounds and the findings.json path in the retro task text, so
      the retro does not reconstruct the halt reason from disk.
  - title: "Fix mode: sync the run worktree to the pushed head"
    detail: >
      After each fix round push, fast-forward the run worktree to the branch head and assert that
      HEAD equals the remote ref. Record the head SHA in the trace.
  - title: "Concierge: check sibling dependency state before a MAP child run"
    detail: >
      For a wayfinder MAP child, read the sibling run index. If a dependency (here GH-560) is halted,
      record the dependent ACs as deferred at the concierge gate, before the run spends build effort.

