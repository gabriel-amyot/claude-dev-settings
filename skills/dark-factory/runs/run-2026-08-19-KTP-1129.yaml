summary: >
  A strong front gate blocked its own green light. The concierge produced 16 live-verified facts, a PASS
  spec, five provable ACs and a matched belt, then halted the entire run on Q6, a launcher .gitignore
  conflict its own artifacts say no AC depends on. Nothing was built. The fix is scope on needs_human
  plus a rule that a question must carry the constraint that makes its obvious answer illegal.
