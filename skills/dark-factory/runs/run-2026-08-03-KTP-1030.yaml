improvements:
  - title: "A demonstrated in-scope-AC finding must re-open the fix loop, not become a HALT_PRESHIP residual"
    detail: >
      The review socket produced a failing test proving the AC3 error-path clobber, then the run halted
      pre-ship with the finding open. Contract 5/6 should treat a DEMONSTRATED finding (has a failing test)
      on an in-scope AC as loop-reopening for at least one bounded iteration before pre-ship halt is allowed,
      especially when the fix is small. Here the fix is two lines: add the same
      `if (get().stateFetchGeneration !== requestGeneration) return;` generation check at the top of the
      catch block in the state, county, and zip fetch actions of map-store.tsx.
  - title: "Guard-symmetry check for race/generation/AbortController fixes"
    detail: >
      When the implement phase adds a request-generation or AbortController guard, add a belt check that
      asserts the guard is applied on ALL commit paths — success AND error/catch (and finally, if it writes
      state) — not just the happy path. The exact defect here was a guard in try{} with none in catch{}.
      A grep-level assertion ('every state-committing branch of a guarded fetch references the captured
      generation') would have caught it at build time.
  - title: "Scope the QA type-check to the change (baseline-diff tsc), not the whole repo"
    detail: >
      qa/lint-types.out surfaced 9 pre-existing TS errors in 4 files unrelated to KTP-1030, adding noise and
      masking whether the change itself is clean. Compare tsc output against the origin/dev baseline (or run
      on changed files) so only NEW type errors gate. Optionally record the baseline error count so the delta
      is auditable.
  - title: "Engage a live-verification socket for frontend tickets whose AC-LOCAL prescribes a runtime harness"
    detail: >
      KTP-1030's AC-LOCAL ships a console harness (POST /api/map/data/state expecting WA clicks 1,484 /
      impressions 319,633 / spend 3,378.20) and a hover-card read as the REQUIRED proof. The frontend QA belt
      stopped at store-level logic tests. Add a frontend-belt QA step that, when an AC-LOCAL contains a
      runnable harness or hover-card check, runs it live (ui-probe against portal.dev or the local stack) and
      captures a hover-card screenshot as evidence — otherwise a logically-correct fix ships without ever
      being observed running.
  - title: "Repair the empty session_id so retro handoffs land in a per-session folder"
    detail: >
      sessions/active/state.yaml session_id has been empty across the 2026-06-11, 2026-06-22, and this
      2026-08-03 run; the live id sits in current_focus (ffc10dc2-...). Fix the session-init/state-write step,
      or have Retro derive the session from current_focus/latest-answer.md, so the improvement handoff lands
      in the session's prompts/ folder and is discoverable by /session:pickup instead of falling back to the
      ticket reports/ folder.

summary: >
  A clean, TDD-honest bug fix for the primary defect: AC2 (a channel subset must not zero a server-non-zero
  state) is fixed via resolveOnDemandRequestChannels always returning undefined so no channel filter reaches
  the backend, with real RED->GREEN captures, 11/11 specs green, and the AC1 regression guard held. Held to
  task_confidence 78 / HALT_PRESHIP by two gaps: a demonstrated-and-unfixed MEDIUM on the AC3 error path (the
  generation guard covers the success commit but not the catch block, so a late stale HTTP 500 blanks the
  newest selection — same asymmetry in county and zip), and the absence of the live hover-card / console-
  harness verification the AC-LOCAL prescribes. factory_fitness 86: the pipeline found and demonstrated the
  AC3 gap but shipped around it instead of re-opening the fix loop, ran a repo-wide tsc that surfaced 9
  unrelated pre-existing errors, engaged no live-verification socket for a frontend ticket, and hit the
  recurring empty-session_id bookkeeping defect. The fix for the residual is two lines per fetch action.
