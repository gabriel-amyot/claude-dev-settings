improvements:
  - title: A demonstrated finding gates, whatever its severity label
    detail: >
      In dark-factory.workflow.js: (a) widen the bounded fix loop's filter from
      `f.severity === 'CRITICAL'` to `f.severity === 'CRITICAL' || (f.severity === 'HIGH' && f.demonstrated
      === true)`, sharing the existing MAX_FIX_ROUNDS budget; (b) in preShipBlockers, add a blocker for
      any remaining `demonstrated === true` finding at HIGH or above, with an explicit named waiver
      (`review.waived: [{finding, why, by}]`) as the only way past it. Rationale: a reviewer who writes
      and runs a failing test has produced evidence, and the factory's whole thesis is that evidence beats
      assertion. Today a self-assigned severity string outranks a red test. This run is the regression
      case: HIGH + demonstrated + trader-facing + criticals_open 0 + no fix round.
  - title: Contract 5 must ask whether a passing test could ever have failed
    detail: >
      Add to contracts/5-review.md: for every AC whose PASS depends on a fixture string, status code, or
      payload shape attributed to an upstream service, resolve that literal in the upstream's source (git
      grep on the upstream repo's deploy branch) and report `fixture_matches_upstream: true|false|unchecked`
      per AC. A false or unchecked value on an AC the review otherwise clears is itself a HIGH finding.
      This run: two shipped tests pin "bid applies are disabled", a string media-api does not emit, and
      that fiction is the only reason AC-3 looks green.
  - title: Mechanical line-reference check inside implement, re-run in QA
    detail: >
      Add a tiny factory tool (tools/verify-line-refs.py) that, for every changed markdown file in the
      diff, extracts `path:line` references, resolves each against the tip, and fails when the target line
      is blank or does not contain an expected token from the citation's own sentence. Wire it into
      contract 4's definition-of-done (run it AFTER the last code commit, not when the citation is
      written) and into contract 6 as a cheap re-check. This run's only blocker is exactly what that
      script catches, and it cost a full pipeline pass plus a QA hand-audit of every changed record file.
  - title: Land the three front-gate fixes already written this morning
    detail: >
      From run-2026-08-19-KTP-1129.yaml, still absent from the code as of this run: (1) `blocks_acs:
      string[]` + `severity: blocking|parkable` on CONCIERGE_SCHEMA open_questions, with the needs_human
      halt firing only on a blocking one; (2) contract 1 must run the command that explains WHY a file is
      untracked/ignored/missing before raising a question about it, and put that constraint plus legal
      options inside the question; (3) mirror consumed answers to <ticket_folder>/factory/decisions.yaml on
      every front-gate exit. Writing a retro improvement and not landing it before the next run on the
      SAME ticket is the failure mode to break here.
  - title: Grill gaps need a machine-readable disposition
    detail: >
      Give the grill phase its own schema field: `gaps: [{ id, severity, must_decide_before_code: bool }]`,
      and require the implement return to carry `gap_dispositions: [{ id, disposition:
      fixed|accepted|moot|deferred, evidence }]` covering every HIGH and MEDIUM gap. Then a gate can check
      that no HIGH gap advanced silently. This run: H1 (which would have reported failure on a write that
      landed) was caught and fixed, but only because implement chose to read the report; H5-H9 have no
      recorded disposition at all.
  - title: Name the code repo and the worktree owner in the concierge return
    detail: >
      Add `code_repo_path` and `worktree_owner: runtime|phase` to CONCIERGE_SCHEMA, and render the
      implement/review/QA prompts from them instead of hardcoding "the runtime gave you your own worktree
      — do NOT run git worktree add". When dark-factory is driven from project-management against a code
      repo elsewhere, that sentence is false and a human currently has to override it in prose. Make the
      waiver a field, not a paragraph inside a JSON answer.
  - title: Put the open findings digest in the HALT_PRESHIP payload
    detail: >
      HALT_PRESHIP returns `blockers` plus the full review object, but the human-facing report renders the
      blocker list. Add `open_findings_digest` (counts by severity, plus title + file for each demonstrated
      finding, plus the findings_artifact path) to the HALT_PRESHIP and READY_TO_SHIP payloads so the
      dangerous residue travels with the terminal state. On this run the halt reads as a documentation
      problem while a trader-facing HIGH sits unmentioned in review/findings.json.
  - title: Make a one-shot live authorization first-class
    detail: >
      Add `live_authorizations: [{ id, scope, one_shot: bool, spent_at, artifacts[] }]` to the concierge
      return, carried through to QA. QA then cites the authorization when it verifies artifacts instead of
      explaining itself in prose, and a re-run knows the difference between "not proven" and "proven once,
      authorization spent". Today the belt forbids a live vendor call in the suite and the AC text demands
      one, and the only bridge is an agent's paragraph.

