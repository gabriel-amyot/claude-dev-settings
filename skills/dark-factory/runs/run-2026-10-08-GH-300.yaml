    parented to an advertiser that does not exist.
  - >
    The ADR for the duplicated plan-id derivation is still a draft in the ticket folder. It has not
    been pushed to agent-os, and the follow-up on map 294 that would keep both sides in step is
    named in the grill report but not confirmed opened.
  - >
    Every AC ledger ends with the same copy-pasted suite line ("85 passed ... 17 passed, 0 failed").
    It reads as a template, so a stale or un-rerun suite would be invisible.
  - >
    Three concierge passes on one ticket. The AC set changed shape (16 to 19) after design-adjacent
    work had begun.
  - >
    Nine criteria depend on an unmerged counterparty branch. The run can reach READY_TO_SHIP
    without any of them having touched the real backend once.

improvements:
  - title: Gate the scaffold commit - a stub must be a stub
    detail: >
      Add a check in workflow.js between scaffold and the TDD loop. For every symbol the plan names
      as a scaffold stub, assert the scaffold commit's body is a throw/TODO/empty return and not a
      working implementation. Fail the scaffold step, not the TDD gate 19 commits later. This one
      check would have prevented this run's halt outright.
  - title: Bind each AC's GREEN to its own commit
    detail: >
      Contract 5 should refuse a GREEN whose diff is empty because an earlier AC already shipped the
      behaviour. AC-6's route half landed inside AC-4's GREEN (54a50ff7). Require that each AC's
      GREEN commit touch at least one non-test line not already covered by a prior AC's GREEN, or
      force an explicit "covered by AC-N" declaration at PLAN time, before any code exists.
  - title: Make a grill "partial" produce a tracked gap list that implement must close
    detail: >
      Grill already emits numbered gaps (G2 to G10). Have contract 3 write them to
      design/grill-gaps.json with ids and a closed=false flag, and have the implement exit check
      require every gap to be marked closed with a commit or an explicit accepted-risk line. Today
      they live only in prose and nothing verifies closure.
  - title: Add a cross-repo identifier check to design
    detail: >
      Contract 2 should require, for every value the portal puts on a URL path or in a request body
      that the counterparty validates, a line naming the counterparty's validator and the proof the
      two shapes match. This run's near-miss was a 36-char UUID aimed at a "^mp[0-9a-z]{18}$" path.
      The check is cheap and would have moved the catch from grill to design.
  - title: Cap the implement slice
    detail: >
      19 ACs in one slice is too large for the gate to be useful feedback. Add a slice-size gate -
      roughly 6 to 8 ACs - and run the TDD gate per slice. The AC-6 violation would then have
      halted the run after about five criteria instead of after all nineteen.
  - title: Require a reviewer for every TDD exemption
    detail: >
      AC-8's "not_applicable (rendered-UI AC, no extractable logic)" is self-granted by the builder.
      Route exemptions to the review socket for a yes/no before the gate evaluates, and record the
      verdict in the ledger. An honest exemption survives review; a lazy one does not.
  - title: Hold at concierge when the issue body is being rewritten
    detail: >
      Three concierge passes on GH-300 because the body changed twice. If the body's hash changes
      after design starts, the workflow should return to the human gate rather than re-run
      silently and let an AC count drift from 16 to 19 mid-flight.
  - title: Carry the unmerged-counterparty dependency into the terminal status
    detail: >
      Nine criteria here are stub-closed against GH-307, which is pushed and not merged. Add a
      terminal state (or a required field on READY_TO_SHIP) that names the branch the run depends
      on, so the main loop cannot open an MR whose verification rests on code that is not on dev.

summary: >
  GH-300 built 19 criteria in app-front-portal with a green suite and honest, commit-stamped
  RED-to-GREEN ledgers for 17 of them, then halted at the TDD gate because AC-6 never had a RED -
  a scaffold commit had written the real behaviour before the test could be authored. The build is
  substantially sound; what is missing is the visual proof, the review pass and any exercise
  against the unmerged GH-307 counterparty.
