    "rendered-UI AC, no extractable logic" - is reasonable but is self-granted with no reviewer.
  - >
    Design confidence 84 on a plan whose status half could never have worked. Soft confidence did
    not correlate with correctness.
  - >
    Grill verdict "partial" with gaps G2 through G10 was treated as a pass. G2 in particular is a
    live data-integrity risk - advertiserId defaults to the "All advertisers" pseudo-brand "0",
