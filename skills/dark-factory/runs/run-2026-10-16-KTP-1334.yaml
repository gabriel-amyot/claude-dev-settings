improvements:
  - title: "Ship-prep gate requires review/findings.json"
    detail: >
      In workflow.js, ship-prep must fail when review/findings.json is missing or empty under the
      ticket folder. Contract 5 must write findings.json even when there are zero findings
      (an empty array plus the reviewed commit range). Two runs in a row (KTP-1335, KTP-1334) lost it.
  - title: "Commit phase artifacts at the end of the run"
    detail: >
      After retro, the main loop commits the ticket folder (analyst, architecture, design, tdd,
      review, qa) on project-management main with "KTP-XXXX: record the factory run artifacts".
      Untracked artifacts are lost on clean or worktree prune.
  - title: "Live-system sub-AC must produce a tracked deferral"
    detail: >
      When QA defers a sub-AC to a live system (Salesforce sandbox, dev deploy), contract 6 must
      write qa/deferred.yaml with the sub-AC, the trigger (for example KTP-1335 merged), and the
      command to run. Ship-prep must surface it in the MR and the Jira comment. Score it PARTIAL,
      not PASS.
  - title: "Design contract reads repo quality gates before planning"
    detail: >
      Contract 2 must read the PMD and Checkstyle rule set, the boundary tests, and the existing
      test doubles before it proposes new fields or hooks. Require a "conventions checked" table
      in impl-plan.md (byte[] copies, no production test hooks, failure wording reuse).
  - title: "Environment-conditional AC must be flagged at the concierge"
    detail: >
      When an AC depends on per-profile config (here withdrawn-at mapped only in dev), the
      concierge or grill must record it as CONDITIONAL in acs.json, and QA must report the AC
      per profile.
  - title: "Infra limits go into grill as verified facts or explicit questions"
    detail: >
      Grill must read the DAC repo for container stop grace and load balancer body limit when the
      design depends on them, or file an open question on the Jira ticket. Do not choose a guessed
      value.
  - title: "Give soft confidence a rubric"
    detail: >
      Each contract states what lowers confidence (amendments by a later phase, deferred checks,
      missing artifacts). Design with five grill amendments should score below 75.
  - title: "Commit subject lint in the implement gate"
    detail: >
      Reject commit subjects with an em-dash separator. Use "AC-7 GREEN, re-read the status ..."
      instead.
  - title: "Resolve the active session id before retro"
    detail: >
      sprint-factory must pass the session slug to contract 9, so the handoff lands in
      sessions/active/<slug>/prompts/ and not in the ticket folder.
