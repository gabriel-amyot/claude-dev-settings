improvements:
  - title: Make review and QA fail closed without an artifact
    detail: >
      The gate must reject a review verdict that has no review/findings.json in the ticket
      folder and a QA verdict that has no qa/results.json. The file, not the returned string,
      is the verdict. This is the third run where an unbacked phase status reached the retro,
      and the first where the retro could prove the string wrong.
  - title: Require a test baseline diff, not a raw pass claim
    detail: >
      QA must run the suite twice, once at the branch tip and once at the merge base, and emit
      qa/test-baseline.json with pass, fail and skip counts for both plus the set of failing
      test ids on each side. ALL_PASS is only allowed when the branch failing-set is a subset
      of the base failing-set. Had this existed, this run would have reported "1 pre-existing
      failure, 0 new" instead of a claim that does not reproduce.
  - title: Pin the test selection against untracked build output
    detail: >
      A gitignored dist/ built mid-run changed which tests select, so the branch worktree and
      the dev checkout do not run the same suite. QA must record whether dist/ exists and either
      build it on both sides of the baseline diff or exclude the bundle tests from the pass
      claim and say so.
  - title: Give the TDD gate a vacuous-AC verdict
    detail: >
      AC-1 and AC-3 have no RED because the chosen resolution removed the thing they describe.
      That is legitimate, and today it is indistinguishable from skipping them. Add a per-AC
      status of vacuous to the gate's input, requiring the analyst's note plus the AC id of the
      criterion that dictated the vacuity. Then "no RED" is an answer, not a silence.
  - title: Force a conditional or vacuous AC onto the Jira ticket before READY_TO_SHIP
    detail: >
      The analyst wrote that AC-1 and AC-3 become live only if a window for AdGroupSpend.spend
      is ever established. That sentence exists only in ac.json. Ship-prep must refuse
      READY_TO_SHIP while any AC carries a conditional or vacuous note without a matching Jira
      comment addressed to the reporter. The project rule already demands this for deferred ACs.
  - title: Fix the empty session_id or delete the session-folder branch of contract 9
    detail: >
      sessions/active/state.yaml has carried an empty session_id for six runs. Either populate
      it at session init or simplify contract 9 to write the improvement handoff to the ticket
      folder unconditionally and stop pretending the session folder is reachable. Sixth filing.
  - title: Fix the stale bundle assertion as its own ticket
    detail: >
      tests/test_bundle_artifact.py line 517 pins 10 tool descriptions against a server that
      exposes 17, and it only runs when a local dist/ exists, so CI and the clean checkout both
      skip it. It is a dormant failing test, not a passing one. File it under KTP-1289's parent
      rather than folding it into this branch.

what_went_right:
  - >
    The analyst did not take the ticket title at face value. "Label or drop" was resolved by
    checking the actual GraphQL document and finding that the ad-group currentFlight block
    carries no dates, so no honest window can be named. That read is what stopped the factory
    inventing a plausible but false label.
  - >
    The resolution followed an in-repo precedent, BIDS_DOCUMENT, removing the field from the
    document rather than stripping it from the response. The fix matches how the repo already
    solved the same problem once.
  - >
    AC-3's note caught a trap: SPEND_SCOPE's current value is literally "the campaign flight,
    not one ad group", so reusing get_campaign_pacing's label verbatim would have been wrong
    had a label been written. Only SPEND_CURRENCY and SPEND_BILLING are reuse-safe.
  - >
    Ship-prep is complete and consistent. Version 0.12.0 across pyproject, manifest and
    uv.lock, a written CHANGELOG, and both agent-os contracts and known-limits updated in the
    same commit range.
  - >
    An adversarial commit landed after the GREEN, hardening the document filter against the
    shapes an override may send, rather than stopping at the minimum that turns the test green.
  - "The branch is pushed, HEAD equals origin, and the worktree is clean."

