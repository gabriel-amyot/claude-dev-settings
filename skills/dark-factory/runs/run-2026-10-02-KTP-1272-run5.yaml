improvements:
  - title: Gate on demonstrated, not on severity
    detail: >
      Change the review gate predicate from `criticals_open == 0` to
      `count(findings where demonstrated == true and severity in [CRITICAL, HIGH]) == 0`.
      A finding with a reproducible failing test is a break regardless of its label. This
      single change would have caught run 5's only shipped regression.
    rank: 1
  - title: A demonstrated finding's test must land in the repo
    detail: >
      Contract 5 should require that any finding with demonstrated == true commits its
      test into the repo suite, not into the ticket folder. Add a ship-prep check: for each
      demonstrated finding, assert its test_ref path exists under `git ls-files`. Green
      test:all over an archived failing test is a false negative by construction.
    rank: 2
  - title: A GREEN may not weaken its own RED's assertions
    detail: >
      Extend the TDD gate: for each RED commit, diff the test files it introduced against
      the branch tip. Any numeric literal in an assertion that moved in the permissive
      direction, or any assertion deleted, halts unless the commit body carries an explicit
      `TDD-THRESHOLD-CHANGE:` line with a rationale. SBE-8's 40 -> 25 is the worked example.
    rank: 3
  - title: Equip the belt from the AC shape, not only the repo type
    detail: >
      Add a concierge step that classifies each AC as logic / visual / data. If any AC is
      visual, the frontend belt must provision a browser-capable QA socket (ui-probe against
      the authenticated Chrome, or the local stack map profile) before implement starts.
      Terminating at NEEDS_VISUAL_VERIFY on an all-visual ticket is a provisioning failure,
      not an outcome.
    rank: 4
  - title: Make the retro write gate code, not only a document
    detail: >
      This is the fifth retro on one ticket. Require every retro's rank-1 improvement to be
      filed as a tracked issue against the dark-factory repo with an owner, and have the
      concierge read the open list at run start and report which recurring gaps are still
      unmitigated. Advisory-only feedback has now demonstrably not changed behaviour across
      five runs.
    rank: 5
  - title: Auto-surface a deferred AC to Jira
    detail: >
      When QA records infra_blocked or DEFERRED on any sub-clause, ship-prep should emit a
      draft Jira comment to the ticket folder and block READY_TO_SHIP until it is posted
      through /post-comment. The always-loaded rule already says a deferral must reach the
      PO; nothing mechanical enforces it, and SBE-4's DOOH clause is sitting on disk only.
    rank: 6
  - title: Act on a low phase confidence
    detail: >
      Treat a self-reported phase confidence below 70 as a signal the next phase must
      consume. Pass implement's confidence and its stated cause into the review prompt as a
      targeted focus list, rather than discarding it into the trace.
    rank: 7
  - title: Reap worktrees at terminal state
    detail: >
      Ship-prep should remove the run's QA and review worktrees once their artifacts are
      copied to the ticket folder. app-front-portal is at 40+ worktrees and four of them are
      this ticket's.
    rank: 8

