improvements:
  - title: "Every contract must emit a trace entry, including DID_NOT_RUN"
    detail: >
      workflow.js should seed the trace with one entry per contract at run start, status
      PENDING, and the retro should treat any entry still PENDING as DID_NOT_RUN. Today a
      phase that never fires leaves no trace at all, so this run's missing review and QA
      look the same as phases that passed. Make the absence loud.
  - title: "Preflight the push remote at concierge time, not at push time"
    detail: >
      Add a git ls-remote --heads origin check to contract 1, next to the repo resolution
      step. If it fails, record remote_reachable: false on the run and tell the operator up
      front that the run will end parked. This run spent a full java build discovering a
      502 that one command would have surfaced in a second.
  - title: "PARKED_AWAITING_REMOTE must persist the branch somewhere durable"
    detail: >
      Before parking on an unreachable remote, bundle the branch to disk outside the
      worktree, git bundle create <ticket-folder>/ship/<branch>.bundle origin/dev..HEAD, and
      record the bundle path and head sha in the telemetry. Right now 41 commits survive
      only as long as nobody runs git clean or git worktree prune.
  - title: "Design must read origin, and prove it did"
    detail: >
      Contract 2 should require git fetch origin followed by
      git rev-list --count HEAD..origin/dev, and refuse to emit any repo_count or
      first-of-its-kind table unless every cited command used an origin/<branch>:<path> form
      or git grep origin/<branch>. Five of this run's nine first-of-its-kind claims were
      wrong because design read a 57-commit-stale tree. The grill is the wrong place to
      catch a class of error that a one-line gate prevents.
  - title: "A partial implement should gate the push, not pass through it"
    detail: >
      implement returned partial at 62, the lowest confidence of the run, and the workflow
      proceeded to push anyway. Any phase returning partial should require an explicit
      machine-readable reasons array in the trace, and a partial implement below a
      confidence floor should route to review before any push rather than around it.
  - title: "Run review on the diff even when the push fails"
    detail: >
      Review reads a diff, not a remote. There was no reason for contract 5 to be skipped by
      a parked push, and review/diff.patch was already captured. Reorder so review and QA
      run before the push attempt, so a remote outage parks a reviewed branch instead of an
      unread one.
  - title: "Report back to the issue on every terminal state, including parked"
    detail: >
      Five runs in a row have ended with the GitHub issue untouched. A park is information
      the map needs. Contract 7 should post the status comment as its first action, before
      the MR step, so an MR that cannot be created does not also swallow the comment.
  - title: "Resolve the session folder before the retro needs it"
    detail: >
      The retro could not find the active session; free-finch had been pruned. Have contract
      1 record the resolved session prompts path on the run object, so contract 9 reads it
      rather than rediscovering it from a directory that may no longer exist.

carry_forwards_for_the_next_agent:
  - "Push GH-307-salesforce-media-plan-submit once cicd.prod.datasophia.com answers again, then open the MR and comment on issue 307."
  - "Run review and QA on the 41-commit diff before the MR, not after."
  - "Decide Race A: the SubmissionAttemptStore is in-memory and nothing claims it is safe."
  - "SalesforceHttpGateway.cachedDescribe is an unsynchronized mutable field on a shared bean. Confirm or fix."
  - "Write spec section 10 is unverified against a live org by design. Say so in the MR description so a reviewer does not read it as tested."
  - "The date DTO deviation, line-item dates typed String rather than LocalDate, belongs in the MR description per grill G-5.3."

summary: >
  Fifteen of fifteen ACs landed with real RED then GREEN pairs and the full 962-test suite is
