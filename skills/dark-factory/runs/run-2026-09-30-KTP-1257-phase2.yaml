improvements:
  - title: "Gate the last commit: no untested production commit after the final GREEN"
    detail: >
      Add a layer-1b check in dark-factory.workflow.js: after the implement agent reports pushed=true,
      walk git log origin/dev..HEAD and flag any commit that touches production files (non-test,
      non-CHANGELOG, non-package.json-version) and sits AFTER the GREEN sha of every AC it names in
      its subject. 7cc7d5e would have been flagged as 723 production lines landing after four ACs had
      already gone green. Halt with "stale GREEN: AC-N's proof predates the code that ships it."
  - title: "Require red.artifact to resolve to a real file, and require the contract-named ledger path"
    detail: >
      tddViolations() currently trusts red.artifact as a string. Make it fs.existsSync() the path and
      additionally require a tdd/AC-<N>.md (or tdd/<phase>/AC-<N>.md) that contains both commit shas.
      Phase 2 wrote tdd/phase2/*.out with no shas and no command lines, and the gate was blind to the
      divergence from contract 4.
  - title: "Persist the halt payload to the ticket folder"
    detail: >
      On every HALT_* return, write the full payload (status, phase, tdd_violations, branch, tip sha)
      to <ticket_folder>/factory/halt-<phase>-<timestamp>.json before returning. This retro spent most
      of its budget reconstructing which AC failed the gate from git listings, because the violations
      array exists only in the caller's return value.
  - title: "Make ac_kind 'visual' bind to a runtime observation"
    detail: >
      The concierge already classifies each AC as visual or logic. Give the classification teeth: a
      visual AC should require either a ui-probe proof screenshot or an explicit
      visual_deferred(<why>) in the ledger, checked by the same gate. On this run 10 visual ACs were
      proven entirely in tsx assertion scripts and the factory raised nothing.
  - title: "Checkpoint the TDD gate per AC instead of once at the end of Implement"
    detail: >
      Run tddViolations() incrementally as the implement agent reports each AC, so a missing RED costs
      one AC rather than 21 commits and a push. Today one unproven AC out of eleven discards a phase
      whose other ten ACs have honest, byte-verified RED/GREEN pairs.
  - title: "First-class multi-repo / multi-phase tickets"
    detail: >
      KTP-1257 needed two runs in two repos on one Jira key. Add a phase or slice identifier to the
      run id so telemetry writes run-<date>-<ticket>-<slice>.yaml natively, and namespace the ticket
      folder subtrees (analyst/, tdd/, review/) by that same slice instead of leaving agents to invent
      phase2/ by hand.
  - title: "Do not push a gate-halted branch bare; mark it"
    detail: >
      The implement contract pushes before the gate runs, so a halted run leaves an unreviewed branch
      on origin that looks like any other. Either push after the gate, or on halt push an empty commit
      or a branch description recording HALT_TDD_GATE so a human reading the remote sees it.
  - title: "Resolve a 'partial' grill before entering Implement"
    detail: >
      Grill returned partial at confidence 73 (its rulings G3 and G6 changed the plan materially) and
      the workflow only halts on status 'stuck'. Require a short design-amend round trip on 'partial',
      or record the unresolved grill findings into the implement prompt so they cannot be silently
      dropped.

