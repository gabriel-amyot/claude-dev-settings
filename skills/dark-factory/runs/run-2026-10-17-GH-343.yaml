improvements:
  - title: "Persist review findings JSON to the main ticket folder"
    detail: >
      Contract for the review phase should write review/findings.json (even when blocking is 0) to the main
      checkout ticket folder, not the worktree. workflow.js should refuse to advance past review unless that
      file exists and its blocking count matches the phase status.
  - title: "Gate cross-repo dependencies with a stamp"
    detail: >
      When the issue body says "depends on X merged to dev", the concierge must emit
      dependencies[{repo, ref, verified_against}] from a git fetch plus merge-base check. workflow.js should
      halt if a declared dependency has no stamp.
  - title: "Emit an activation checklist for flag-gated work"
    detail: >
      Ship-prep should write reports/activation.md listing the flag name, the DAC repo and variable per
      environment, and the live proof still owed (here sandbox S1/S2). The main loop links it from the MR.
  - title: "Reject browser steps that cannot fail on the claim they name"
    detail: >
      QA contract should require each browser test to name the assertion that would fail without the change.
      A step that passes via a different mechanism (dedupe vs latch) must be renamed smoke or get a distinct
      fixture (here, a second fixture plan version so regenerate sends a second POST).
  - title: "Start the frontend proof server through a standard preflight"
    detail: >
      The frontend belt should start or detect the local portal on a known port and stub or silence absent
      proxy services, so screenshots carry no dev-error overlay. Record the BASE_URL in tdd notes automatically.
  - title: "Resolve the active session from the ledger, not state.yaml"
    detail: >
      Contract 9 handoff path resolution should query `ledger --org klever` for the session that launched the
      workflow. Fall back to the ticket reports folder only if the ledger lookup fails.

