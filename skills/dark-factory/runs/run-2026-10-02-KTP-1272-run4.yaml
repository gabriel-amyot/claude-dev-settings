improvements:
  - title: "A full-auto run may not block on a question it has already answered"
    detail: >
      When the concierge emits a recommendation (here recommended_base, with a two-way containment
      proof) and the handoff mode is full auto, workflow.js should adopt the recommendation, stamp
      the decision and its evidence into the run record, and continue. Reserve the human block for
      questions with no defensible default. Rank this first: it is the single change that would have
      let this run build.
  - title: "Make BLOCKED_NEEDS_HUMAN_* unreachable without an inbox item"
    detail: >
      Add a terminal-state gate: any status containing NEEDS_HUMAN must write
      general/inboxes/gabriel/pending/<date>-<ticket>-<slug>.md stating the question, both options,
      the recommendation, and the cost of waiting, then update that folder's INDEX.md. If the file
      is not on disk the state is not accepted. A block nobody can see is worse than a halt.
  - title: "Verify the premises of a human answer before the run consumes it"
    detail: >
      A resume answer referencing a branch, a base or a version is a claim about repo state. At run
      start, re-derive each claim: is the branch merged, is the base still ahead, is the version
      free. Any falsified claim invalidates that clause of the answer and the concierge must say so
      before planning around it. This closes the inbox item pending since 2026-09-18, and it is the
      direct cause of this halt.
  - title: "Add a version-collision preflight"
    detail: >
      Compare package.json version on the working branch against origin/dev before the belt is
      chosen. A branch holding a version that dev has already claimed is a guaranteed MR conflict,
      and klever-mr will catch it far too late. One line, and it is half of Q1.
  - title: "Stop re-typing the last four retros and put them in workflow.js"
    detail: >
      Carried unimplemented across four runs: per-AC TDD gating at each GREEN, the gate reading
      tdd/AC-<N>.md off disk rather than only the returned JSON, the Implement AC ceiling,
      PARKED_AWAITING_REMOTE with a bounded resume probe, review-vs-exclusion arbitration, and
      automatic re-injection of runs/run-*-<TICKET>*.yaml into the concierge prompt. Pick the two
      cheapest, write them as code, and let the rest wait. Four runs of prose is the metric that
      matters here.
  - title: "A view state that renders nothing must fail a gate, not a code review"
    detail: >
      SBE-2 reached dev because view === 'panel' returned null and no panel existed. The concierge
      already wrote the rule for run 4. Promote it to a frontend-belt test requirement: every value
      of a view/state union must have a test asserting it renders a non-empty surface. This is the
      class of defect that makes a partial feature read as a broken one.
  - title: "Reap worktrees when their branch merges"
    detail: >
      33 worktrees exist on one repo. At run end, any worktree whose branch is an ancestor of
      origin/dev should be reported for removal, and any untracked file inside one should be
      surfaced before it is lost. The review proof test for this ticket survives only because a
      human copied it into the ticket folder.
  - title: "Alarm when work reaches dev without QA"
    detail: >
      Slice 3 merged with QA never run and a review that predated its fix. A post-merge check should
      compare the merged branch against the run records for that ticket and raise an item when no
      run reached a QA PASS. Merging is not evidence.

what_went_right:
  - "The concierge ran a live fetch and refused to plan on the handed-down premise. It proved containment two ways rather than trusting the resume note."
  - "It named the version collision explicitly, with the consequence spelled out, instead of discovering it at MR time."
  - "The slice-3 stranded push resolved: the watcher script pushed, the branch merged into dev, and nothing was lost."
  - "The discipline block in run-slice.run4.json reads like a direct answer to how SBE-2 escaped: an importer outside __tests__/ before any AC passes, and no view state that renders nothing."
  - "The scope was rebuilt from human-confirmed SBEs with screenshots, abandoning the Part 1 / Part 2 split that caused the broken-on-dev read."
  - "Blocking was not wrong in itself. The base-branch question is real. Only the channel and the full-auto contract were wrong."

