improvements:
  - title: Make the remote outage window a schedule input, in workflow.js, not in a retro
    detail: >
      Add a preflight step to the concierge gate that runs git ls-remote against the target
      remote and reads the clock. If the remote answers 502, or if local time sits inside the
      documented 11 PM to 5 AM ET Datasophia window, the gate must either refuse to start a run
      whose terminal state requires a push, or start it with push deferred and the operator
      told. This is the third filing of this item. It is now the single highest-value change on
      the list because it has demonstrably cost two complete runs.
  - title: Add PARKED_AWAITING_REMOTE as a non-terminal state with a bounded resume probe
    detail: >
      When the worktree is clean, HEAD is green and the only failure is the push, the run must
      not end in HALT. Record the branch, the HEAD sha and the ticket folder, then poll
      git ls-remote every fifteen minutes for up to six hours and push on the first success.
      Only after the budget expires does it become a halt.
  - title: Make review/findings.json a hard write gate before the fix socket may run
    detail: >
      The fix socket must refuse to start unless review/findings.json exists in the ticket
      folder with one entry per finding, each carrying id, severity and the file and line it
      concerns. Fix then closes findings by id. This run found two real blocking defects and
      left no machine-readable trace of either.
  - title: Forbid a fix phase from returning partial or PASS without a review re-pass
    detail: >
      After fix-1, re-run the review socket against the new HEAD and require every blocking
      finding id to be marked closed with a commit sha. A fix that self-reports partial at
      confidence 62 is exactly the case the gate exists for. This is the second filing.
  - title: Commit the review proof test onto the branch, never leave it in a review worktree
    detail: >
      The review socket should write its proof test into the ticket folder under review/ AND
      cherry-pick it onto the feature branch as its own commit. Second filing. This run again
      leaves the only copy untracked in a detached-HEAD worktree.
  - title: Make the QA socket's absence an explicit, recorded decision
    detail: >
      QA did not appear in the trace at all. Either the socket must run, or the workflow must
      emit a qa phase with status skipped and a reason, so the trace shows a decision rather
      than a gap. No run should need its retro to discover whether HEAD compiles.
  - title: Turn an open grill gap into a gate item, not a markdown sentence
    detail: >
      G6 and G7 are both decisions the grill asked the implement phase to make explicitly. Carry
      every unresolved grill gap into a machine-readable design/open-gaps.json that the implement
      socket must resolve or explicitly defer by id. Third filing of this shape.
  - title: Fix the empty session_id or delete the session-folder branch of the handoff rule
    detail: >
      sessions/active/state.yaml has carried an empty session_id for four runs, so contract 9's
      primary handoff target never resolves and the fallback is always taken. Either populate it
      at session init or simplify the contract to write to the ticket folder unconditionally.

what_went_right:
  - >
    The concierge gate answers are the best in the recent record. Q1 rejected both offered cache
    shapes, named a third (per-ZIP byte slices), and justified it with the request-path and heap
    arithmetic for all three options. It also forbade quoting the ~120 MiB figure as measured.
  - >
    The grill ran real experiments instead of reasoning. Two compiled JDK 21 probes over the real
    corpus retired the plan's highest-risk item and pinned its exact failure mode.
  - >
    G1 is a genuine, shipped-bug-class find: 106 of 1,000 prefixes have no chunk, so a real USPS
    ZIP such as 00501 would have returned 503 for an entire 4,000-id request. The grill derived
    the fix from the contract's own definition of not_found and recorded it as an ADR draft.
  - >
    TDD discipline was clean without correction. Eight ordered AC pairs, plus a RED-first pair
    for the review fixes.
  - >
    Both blocking review findings were real and both fixes are sound. Shipping census disabled,
    and failing fast at startup on an unresolvable local directory, is better than the 503 per
    request that the shipped defaults would have produced.
  - >
    Scope was held. The concierge excluded the startup warm, the semaphore and the condemnation
    machine with a stated reason, and the implement phase did not drift into them.

