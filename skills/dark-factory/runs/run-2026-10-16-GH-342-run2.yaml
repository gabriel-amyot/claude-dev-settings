improvements:
  - title: "Pass blocking findings and violations into the retro prompt"
    detail: >
      In dark-factory.workflow.js, build the retro prompt from the terminal result. Include
      blocking_findings (severity, ac, title, test_ref) and tdd_violations, not only per-phase counts.
      This is the third run that needed it.
  - title: "Copy review artifacts from the agent worktree to the main ticket folder"
    detail: >
      After every review and fix agent, copy <worktree>/tickets/.../review/findings.json and
      review/tests to the main ticket folder, or run these agents without isolation when the target
      ticket folder is in project-management. Then remove the worktree. Assert in the preamble that no
      worktree is created under project-management.
  - title: "Grill must probe write-path semantics for update-in-place designs"
    detail: >
      Add a contract 3 checklist item. When a design reuses an existing update path for a new intent,
      the grill lists that path's field rules (fill-only, create-only, absent-key behaviour) and asks
      for one test per rule against the new intent. This finds the fill-only and omitted-key defects
      at design time.
  - title: "Fix rounds must fix the root cause, not the field"
    detail: >
      Contract for Fix: when a finding names a root cause shared by several fields, the fix adds a
      table-driven test over every mapped field, not one field. Review 3 then would have found the
      omitted-key case in round 2.
  - title: "Allow one narrow convergence round"
    detail: >
      When the last review has criticals_open 0, fewer blocking findings than the round before, and
      all share one cited root cause, allow one extra fix round scoped to those findings only. Keep
      the hard stop if the count does not drop.
  - title: "Re-run execute-verify after fix rounds that touch the main path"
    detail: >
      Make the last fix round refresh execute-verify.md at the new head, or have QA do it. The
      artifact must cite the head it ran against.
  - title: "Record resume provenance in the trace"
    detail: >
      When a run builds on top of a pushed branch after a halt, add a trace entry that says what
      cleared the earlier halt (artifact path and verdict).

