title: >
  app-ttd-trading-mcp: package the MCP server as a .mcpb desktop extension carrying a pinned arm64
  CPython, so a trader installs it from Settings and Extensions with no git, no uv and no 1Password
  CLI, and with no write capability on the laptop. Four ACs built (AC-5 deferred by Q3), belt
  python-service, dev only.

terminal_cause: >
  preShipBlockers fired on the QA verdict. QA returned PARTIAL with a real (non-visual) gap, so
  qa_gap classified as real_gap and the pipeline halted before ShipPrep. The gap is honest and
  correctly refused:
    AC-4 PARTIAL — a REFUSED Auth0 credential (a mistyped client id or secret, the most likely trader
      misconfiguration) is rejected by the token proxy at the first upstream hop. media_api.py:162-165
      raises UpstreamError("the token proxy answered 401"), which selfcheck._classify does not match,
      so the self check reports outcome='upstream', whose own docstring means "the install may still
      be correct". AC-4 requires "a missing OR REFUSED credential reports a named credential or seat
      failure". The reviewer demonstrated it with a probe test; QA independently replayed it for both
      401 and 403. Open at the tip.
    AC-3 PARTIAL — the AC's named proof (grep for the real client secret VALUE over the tree, the
      unpacked bundle and claude_desktop_config.json) could not run: `op whoami` returns "account is
      not signed in" and signing in to 1Password is a human step.
  The halt is the factory doing its job. It refused to ship a bundle whose self check would send a
  trader with a mistyped secret to look at the network.

