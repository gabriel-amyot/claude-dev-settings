improvements:
  - title: "Phase artifacts must be written to the REAL ticket path and verified with existsSync — and the factory must stop creating worktrees inside project-management"
    detail: >
      Root cause is now known, so this stops being a prose note. Two changes. (1) Path: the review and
      QA prompts must write to an ABSOLUTE ticket path resolved outside the Workflow worktree, not to
      a relative tickets/... path that resolves inside project-management/.claude/worktrees/wf_*/.
      Pass the absolute ticket_folder into the prompt and require the artifact path returned to start
      with it. (2) Check: add a post-return validator on review and QA that does existsSync on
      findings_artifact and qa/result.yaml, parses the JSON/YAML, and asserts the parsed findings
      length equals the returned findings length. On failure, fail the gate and re-dispatch with the
      miss quoted. workflow.js currently has zero existsSync/readFileSync/statSync. Then add a cleanup
      step that removes the run's wf_* worktree after the terminal, and do a one-off recover-then-prune
      pass over the eight stranded ones (they hold artifacts for 16 tickets — recover before deleting).
  - title: "Give a demonstrated HIGH finding somewhere to go"
    detail: >
      criticals_open == 0 is currently the only thing that can trigger the fix loop, so a HIGH with a
      probe test, an observed failure string and a named file evaporates. Change contract 5 so every
      finding of severity HIGH or MEDIUM carries a required disposition field: fix-now (enters the
      bounded fix loop), follow-up-drafted (the reviewer writes a ticket draft to
      reports/reviews/followups/ and ship-prep surfaces it in the MR description), or
      accepted-with-reason (one sentence). Add a workflow.js assertion that rejects a review whose HIGH
      findings have no disposition. On KTP-1062 this would have caught the null-root defect, which is
      the client's primary not-found path against a server that is already known to return an empty
      200 on exactly that case.
  - title: "Every terminal, including a HALT, writes the front-loaders back"
    detail: >
      README.md and STATUS_SNAPSHOT.yaml are the documented recovery save point and they have now
      misreported two consecutive terminals ('Implementation: Not started' against 12 pushed-nowhere
      commits, plus a stale blocker naming a file that exists). Add a workflow.js post-terminal hook
      that rewrites factory_phase, active_slice, implementation_started, tool_belt, branch, head sha,
      terminal status and the produced-artifact list from the run trace, and clears any blocker whose
      named file now exists. It must run on HALT_* terminals too, which is where a resuming agent is
      most likely to read them.
  - title: "The concierge must consume the ticket's own blocker list and pick the terminal up front"
    detail: >
      STATUS_SNAPSHOT.yaml said the GitLab repo does not exist before the run started, and
      preShipBlockers rediscovered it five phases later. Contract 1 should read slice_b_blockers /
      outstanding_human_actions / prereqs from the ticket folder and, when a listed blocker maps to a
      known preShipBlocker (no remote, branch cannot be pushed, no dev environment), either down-scope
      the run explicitly or declare the expected terminal at the gate: 'this run will end at
      HALT_NO_REMOTE, the code will be real and committed, proceed?'. Same class as the KTP-781 finding
      that no gate consumed the existing on-disk diagnosis.
  - title: "Unpushable work needs a durability artifact, not just a halt"
    detail: >
      When impl.pushed is false because no remote exists, HALT_PRESHIP leaves the only copy of the work
      on local disk inside a worktree that a prune or a clean would take. Before halting, the factory
      should write 'git bundle create <ticket-folder>/factory/<branch>.bundle --all' into the ticket
      folder (which IS backed up by project-management's git) and name the bundle plus the exact
      'git remote add / git push -u' recipe in the halt output and in the inbox item. Restoring from a
      bundle is one command; rebuilding 12 TDD commits is a night.
  - title: "Grill carry-forwards must be a checklist the terminal verifies"
    detail: >
      G1 to G8 were code-side and all executed. G9 (refresh STATUS_SNAPSHOT) and G10 (rescue the /tmp
      evidence file) were documentation-side and both dropped, and G9 was ALSO an improvement from the
      previous retro. Contract 3 should emit its carry-forwards as a structured list
      ({ id, action, owner_phase }) rather than prose, and the terminal step should assert each one is
      either done or explicitly waived. While there: any evidence path under /tmp is not evidence —
      require the phase that cites it to copy it into the ticket folder first.
  - title: "Discharge the deferred-AC obligation, second ask"
    detail: >
      jira/comments.yaml is [] across both runs while factory/jira-comment-draft.md sits ready and
      STATUS_SNAPSHOT lists 'post the deferred-AC question to Jira' as outstanding. The project
      CLAUDE.md forbids the phrase 'needs PO input' existing on disk without a matching Jira comment.
      Ship-prep (and the HALT path, since this run never reached ship-prep) should scan the ticket for
      deferred/provisional markers and refuse a clean terminal until each has either a drafted comment
      queued for /post-comment or a pending inbox file. Also enforce the inbox rule the run half-kept:
      the KTP-1062 pending item exists but was never linked from general/inboxes/gabriel/INDEX.md, so
      it is invisible from the entry point.
  - title: "Fix the empty session_id at the source, fifth time of asking"
    detail: >
      sessions/active/state.yaml session_id is empty while the live id sits inside the current_focus
      JSON blob. Flagged on KTP-1030, KTP-708, KTP-1020 and both KTP-1062 runs. It also caused a
      handoff filename collision this run (dark-factory-improvements-KTP-1062.md already existed from
      the slice A retro, so this one had to be suffixed). Either fix the session-init write, or have
      contract 9 parse current_focus and resolve the per-session prompts folder itself, and make the
      handoff name include the date so two runs on one ticket cannot collide.

summary: >
  KTP-1062 slice B halted correctly at HALT_PRESHIP on a real human gate (the GitLab repo does not
  exist, so nothing could be pushed): task_confidence 56 / factory_fitness 65. The build itself is
  strong. Twelve commits, halt-mode TDD with QA re-deriving all four REDs from behavioural failures,
  33 tests green, a reproducible uv environment, an executed stdio handshake with every KLEVER_*
  variable stripped, and a review that demonstrated six real findings with probe tests. It scores low
  on task because the client has never spoken to anything real (Jira AC-1 and AC-5 stay open, all
