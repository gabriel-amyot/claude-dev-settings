improvements:
  - title: "Add a deferred_post_merge verdict class to classifyQaGap"
    detail: >
      When an AC has deferred_sub_acs in analyst/acs.json and QA proves every non-deferred part,
      QA returns verdict DEFERRED (or PARTIAL with deferred: true and a deferred_to: post_merge_validate).
      classifyQaGap treats it like visual_only. The terminal state becomes READY_TO_SHIP with a
      post_merge_checks array that the main loop runs in contract 8. Add a GH-560 AC-4 case to tests.
  - title: "Replace the n/a code_ref prefix test with a structured field"
    detail: >
      QA_SCHEMA gets per_ac.no_code_surface (boolean). isMetNonCodeGate reads that field, not
      /^n\/a/ on code_ref. Contract 6 states the rule. Add a regression test where code_ref names a ledger file.
  - title: "Pass the terminal payload to Retro"
    detail: >
      The workflow passes status, blockers, qa_gap, qa_capped and tdd_violations into the Retro prompt.
      Contract 9 requires a halt_cause block that quotes them. This repeats run 1 improvement 1. Promote it.
  - title: "Ship the ac_kind evidence class from run 1"
    detail: >
      Add evidence to the concierge ac_kind enum. tddViolations accepts evidence ACs with doc_claims and
      a .md deliverable. This removes grill G7 style workarounds that read gate source.
  - title: "Java belt toolchain and PMD preflight"
    detail: >
      Concierge resolves the pom maven.compiler release/source, finds a matching JDK once, and passes JAVA_HOME
      to every phase. It checks for pmd and fails fast or records blocked(pmd_missing) at the front gate.
  - title: "Clean up workflow worktrees at terminal state"
    detail: >
      On any terminal status, remove every worktree the run created except the one that owns the pushed branch,
      or release the branch name with git worktree remove before QA. QA never needs a detached checkout.
  - title: "Make grill parked items a gate input"
    detail: >
      Each parked item has a signature. If the diff matches and args.accepted_parked has no entry, the run
      returns BLOCKED_NEEDS_HUMAN at the end of grill, not after QA. Repeat from run 1.
  - title: "Flag IT-excluded-from-CI at design"
    detail: >
      Java belt design checks surefire excludes and failsafe presence. When a new *IT.java will not run in CI,
      the plan must state it and propose a follow-up ticket. Review then has nothing new to flag.

