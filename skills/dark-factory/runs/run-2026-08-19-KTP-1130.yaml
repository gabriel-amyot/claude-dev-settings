title: >
  app-ttd-trading-mcp: package the MCP server as a .mcpb desktop extension with a bundled pinned arm64
  interpreter, so a trader installs it from Settings and Extensions with no git, no uv, no 1Password
  CLI, and no write capability on the laptop. Five ACs, belt python-service, dev only.

terminal_cause: >
  The concierge ran once and returned spec_quality FAIL with needs_human true. The verdict is CORRECT
  and well-evidenced. Nine facts, each with a source command and an assumption_audit, all read from
  origin/dev after a fetch (the local main checkout is stale and dirty, and was refused).
  Four independent spec defects, any one of which blocks a safe build:
    Q1  Definition of Ready unmet. The ticket says "Not started until Gabriel comments Approved on this
        ticket" and the ticket has zero Jira comments (F9). The gate refused to self-approve.
    Q2  AC-2 asserts "the served tool list matches the seven names from the tool contract ticket". No
        such ticket exists (F3, two independent probes). The live surface on origin/dev is exactly FOUR
        tools, hard-pinned by tests/test_tool_schemas.py::test_exactly_these_four_tools_are_exposed,
        and the contract page states "A fifth tool is a contract change, not an addition" (F1).
    Q3  AC-5 names check_apply_status, which does not exist anywhere on origin/dev (F2), and depends on
        KTP-1127 and KTP-1128, both TO DO (F4). AC-5 also describes a browser-Confirm write model that
        contradicts the direct-write apply_bid_change that KTP-1129 actually shipped.
    Q4  AC-3's "never falls back to a default" contradicts ADR-0001: KLEVER_TTD_SEAT is optional and
        defaults to lklghjp when absent (F5). Two legal repairs, two different diffs.
    Q5  Three sub-criteria are human-run, not factory-verifiable (fresh macOS account install, trader
        install + read in a desktop client, live gateway read).
  UNLIKE the KTP-1129 halt, this one is not a false block. AC-2 and AC-5 cannot be built as written by
  anyone, and the ticket's own Definition of Ready was unmet. The factory refused a bad spec cheaply.

