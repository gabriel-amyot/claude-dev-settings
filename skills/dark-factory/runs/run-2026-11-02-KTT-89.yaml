improvements:
  - title: "Contract 5: require a state-space sweep in review round 1"
    detail: >
      When the diff adds logic that scans or rewrites a message history (or any ordered or tree
      structure), the first review must enumerate the input shapes (single, retry, edit sibling,
      mixed error causes, receipt) and test each one. Record the list in findings.json as
      surface_sweep. A later round may block only on a shape outside the sweep or on a regression
      from a fix. Same improvement as GH-561. Two runs now justify applying it.
  - title: "Contract 3 (grill): an assumption audit must check the write side, not only the read side"
    detail: >
      For any CONFIRMED premise about data shape, the grill must cite both the code that writes
      the shape and the code that reads it. A4 cited only the runtime load. Add a column
      write_source to the assumption table and fail the premise if it is empty.
  - title: "workflow.js: one bonus fix round for a converging, small residual"
    detail: >
      If each fix round cleared its blocker, the residual has no CRITICAL or HIGH, and each residual
      finding has a test_ref the fixer can adopt, run one extra fix round before the blocked
      status. Cap the total at 3. Record it in the trace. KTT-89 and GH-561 would both have reached
      QA.
  - title: "workflow.js: name the review terminal status by the rule that fired"
    detail: >
      Return BLOCKED_REVIEW_CRITICAL only when a CRITICAL is open. Return
      BLOCKED_REVIEW_DEMONSTRATED for a demonstrated non-critical blocker. Second run with this
      mislabel. Apply before the next run.
  - title: "Contracts 4, 5: never overwrite round artifacts"
    detail: >
      Write review findings to review/findings-round-N.json and TDD ledgers to
      tdd/AC-X-round-N.md (implement is round 0). Keep findings.json as a pointer to the latest.
      The round number must match the trace phase name.
  - title: "Frontend belt: ship the review e2e harness inside the repo toolchain"
    detail: >
      Provide a belt script that runs a reviewer spec from review/tests/ without manual copy and
      resolves esbuild from the repo node_modules. Remove the hand-set ESBUILD_PATH.
  - title: "Retro prompt: pass blocking findings, findings path and round artifacts"
    detail: >
      Include blocking_findings, fix_rounds, the findings path and the commit SHAs per round in the
      retro task text. Same gap as GH-561.
  - title: "Contract 2 (design): a superseded behavior must become a PO question"
    detail: >
      When the design removes or replaces an existing user-facing behavior (here
      InterruptedRunBanner on the Media Plan rail), write it as an explicit concierge question, not
      a design note. It reached review as a LOW finding.

