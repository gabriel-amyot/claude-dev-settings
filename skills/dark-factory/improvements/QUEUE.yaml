  - Capture and return the skip cause in every HALT_AGENT_SKIPPED null-guard
  detail: 'All eleven null-guards in dark-factory.workflow.js return { status: ''HALT_AGENT_SKIPPED'',
    phase, ticket } with no cause. Extend agent() (or the guard sites) to surface WHY the return was null
