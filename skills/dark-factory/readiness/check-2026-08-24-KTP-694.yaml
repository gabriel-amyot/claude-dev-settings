policy_note: >
  The target is PROD BigQuery (prj-p-grid-insigt-71np8gpms3). The
  terraform-dac-infra belt is explicitly scoped "dev-only autonomous,"
  and the shipping safeguards require a human gate for prod data
  mutation. The factory should not write prod data unattended regardless
  of belt fit. This is the correct outcome, not a capability gap to fix.

risk_to_watch: >
  Missing-table handling is asymmetric. CbgToZipCrosswalkAdapter.java:47-49
  catches and falls back to county aggregation. PlacerEntityBridgeAdapter.java:58-61
  re-throws as RuntimeException, and neither caller catches
  (StoreMetricsService.java:88, VisitorOriginService.java:65). A partial
  migration -- crosswalk lands, entity bridge does not -- is a prod
  outage path. The ticket has no ordering constraint and no rollback AC.

blocking_before_launch:
