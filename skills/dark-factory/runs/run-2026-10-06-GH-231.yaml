improvements:
  - title: Make the remote outage window a schedule input, in workflow.js, not in a retro
    detail: >
      Add a preflight to the concierge gate that runs git ls-remote against the target remote
      and reads the clock. If the remote answers 502, or local time sits inside the documented
      11 PM to 5 AM ET Datasophia window, the gate must refuse to start a run whose terminal
      state requires a push, or start it with push deferred and the operator told. FOURTH
      filing. It has now cost three complete runs, two of them in one night, and it is a
      twenty-line check.
  - title: Add PARKED_AWAITING_REMOTE as a non-terminal state with a bounded resume probe
    detail: >
      When the worktree is clean, HEAD is green and the only failure is the push, the run must
      not end in HALT. Record branch, HEAD sha and ticket folder, poll git ls-remote every
      fifteen minutes for up to six hours, push on the first success, then open the MR. Only
      after the budget expires is it a halt. Third filing. GH-230 and GH-231 are both sitting in
      exactly this state right now and both are recorded as failures.
  - title: Give a non-blocking review finding an owner before the run may reach a terminal state
    detail: >
      Review has one lever today, blocking or not blocking, so anything below blocking falls off
      the pipeline. Add a third outcome, carry_forward. Before any terminal state, every finding
      in review/findings.json must be closed by a commit sha, converted into a filed follow-up
      issue, or explicitly waived with a one-line reason recorded in the telemetry. This run
      demonstrated a 204-becomes-500 bug with a live repro and it currently exists nowhere a
      future session will look.
  - title: Make a demonstrated AC-wording mismatch a blocking outcome, not a LOW finding
    detail: >
      Review proved AC-5 costs two requests at the cap where the AC words one. That is not a
      code-quality note, it is the acceptance criterion failing on its own terms at a reachable
      input. Add a review rule: if a finding contradicts the literal text of an AC, it is
      blocking regardless of severity, and it closes by either a code fix or a recorded AC
      renegotiation. Fixing this one is two lines, raising CENSUS_MAX_IDS_PER_REQUEST to
      CENSUS_MAX_FEATURES, or making the batches concurrent.
  - title: Require a gate-answer fallback to be emitted as its own decision record
    detail: >
      Q1 carried a primary instruction and a fallback. The run took the fallback and said so in
      one AC's note field. When a phase takes the escape hatch of a gate answer it must write
      factory/decisions-taken.yaml with the decision id, which branch was taken, and the
      evidence that the primary was unavailable. The orchestrator and the MR body read from
      that file, so the fallback cannot be silent.
  - title: Require the TDD RED re-verification to be data, not prose
    detail: >
      QA's four-condition re-verification per AC is the best TDD evidence this factory has
      produced, and it lives as YAML notes inside a result file with no schema. Emit it to
      tdd/red-verification.json with one object per AC carrying red sha, stat summary,
      pass and fail counts at red, diff-empty boolean and pass count at tip. Then the gate can
      check it and future retros can diff it. Also add the AC-2 shape, a RED reached by removing
      an existing gate, as a flag the schema can carry.
  - title: Do not serialise two halves of one seam into the same outage window
    detail: >
      GH-230 and GH-231 are the backend and frontend of one cutover and both died unpushed on
      the same 502 inside one night. When the concierge resolves a ticket with an unmerged
      sibling dependency it should record the dependency and refuse to start the dependent half
      while the first half is unpushed, or at minimum stamp the run as
      depends_on_unpushed_branch so the retro and the MR say so.
  - title: Fix the empty session_id or delete the session-folder branch of the handoff rule
    detail: >
      sessions/active/state.yaml has carried an empty session_id for five runs and the folder
      named in the ledger does not exist on disk. Either populate it at session init or simplify
      contract 9 to write the improvement handoff to the ticket folder unconditionally. Third
      filing.

what_went_right:
  - >
    The grill found that middleware.ts excludes /api from its matcher, which makes
    requireComponent("Planning") the ONLY gate on the new route. Without that read, a plausible
    implementation would have leaned on middleware and shipped an open proxy to the census
    backend. That single fact is worth the phase.
  - >
    Review wrote a real machine-readable findings file and two committed probe tests inside the
    ticket folder. Two of four findings are DEMONSTRATED with a run. The MEDIUM is honest enough
    to record that the same construction already exists elsewhere in the repo, so it is a
    pattern and not a regression. This is the exact failure GH-230's empty review/ had, fixed.
  - >
    QA re-verified every TDD RED by four independent conditions, including git diff RED..HEAD on
    the test file, which is the condition that catches a swapped test. All six ACs pass all four.
  - >
    QA proved AC-1 and AC-2 against a live next dev server rather than against mocks, with a
    loopback echo upstream and a UM stub, and kept the raw curls and server logs on disk. The
    AC-2 proof includes the strongest possible negative evidence: the upstream log is EMPTY, so
    the backend was never contacted.
  - >
    Lint and typecheck were diffed against the origin/dev baseline rather than reported raw.
    8 TS errors and 44 lint errors on both sides, none in a changed file. No pre-existing noise
    was laundered into this run's score, in either direction.
  - >
    Q2's gate answer named the variable, justified the name, defined both semantics, and named
    the silent failure mode at the #234 cutover: a renamed var stays unset and the app keeps
    serving static files while the deploy looks successful.
  - >
    Scope was held. #234's cutover, the public/census deletion and the CITY/COUNTY/STATE grains
    were declared out of scope by the analyst and no phase drifted into them.

resume_pointer: >
  Push GH-231-census-proxy-route from
  /Users/gabrielamyot/Developer/grp-beklever-com/.worktrees/GH-231-census-proxy once the
  Datasophia git tier answers, and push GH-230 first so the seam lands in dependency order.
  Before the push, fetch origin/dev again (every diff in this run is against a local ref that
  could not be refreshed) and re-run the five seam suites. Decide AC-5 explicitly: either raise
  CENSUS_MAX_IDS_PER_REQUEST to CENSUS_MAX_FEATURES, or make the batches concurrent, or
  renegotiate the AC wording on issue #231. File the 204-becomes-500 MEDIUM as its own issue
  under #227, scoped repo-wide since app/api/map/data/zip/route.ts shares the construction.
  Then take the flag-on visual proof that Q1 asked for, with the GH-230 backend running locally
  from its worktree, before #234 flips the default.
