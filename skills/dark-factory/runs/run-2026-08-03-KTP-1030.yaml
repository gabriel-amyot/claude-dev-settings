qa_detail: >
  PARTIAL, and it reflects two distinct gaps. (1) A demonstrated MEDIUM AC3 gap: the request-generation
  guard (`if (get().stateFetchGeneration !== requestGeneration) return;`) sits only in the try/success path;
  the catch block sets `stateMapData: null` with no generation check, so a superseded older request that
  fails late (HTTP 500) blanks a state a newer request already loaded — violating AC3 ("a slower/out-of-order
  response never overwrites the newest selection"). Preserved failing test: review/ktp-1030-stale-error-
  clobber.spec.ts; residual capture qa/AC-3-error-path-residual.out shows Expected 1484 / Received undefined.
  Left UNFIXED. Same asymmetry exists in the county (:775-786) and zip (:892-903) fetch actions. (2) No live
  ground-truth verification: the AC-LOCAL ships a console harness (POST /api/map/data/state) and a hover-card
  read against the running app as the required proof; QA proved logic at the store layer only (mocked fetch),
  never executed the spec's live check, and captured no hover-card screenshot. Also note qa/lint-types.out:
  9 pre-existing TS errors in 4 files UNRELATED to KTP-1030 (market-copy.spec.ts, read-sse-stream,
  format-helpers, calculate-flow-lines) — repo-wide tsc, not scoped to the change.

