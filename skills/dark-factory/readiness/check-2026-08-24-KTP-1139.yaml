blocking_before_launch:
  - >
    AC4 defers its own pass condition: "load-time target agreed with
    dev." There is no number to test against. An AC that cannot fail
    cannot pass.
  - >
    Canada has no data path. No Canadian census/demographics table, and
    Placer has no Canada coverage. Montreal ships today only as a
    degraded city (city-config.js:20-22, placerFile null).
  - >
    Nationwide POI sourcing does not exist. The Overture FORMAT is
    already in production (categories.js:1-2 maps Overture
    categories.primary to display segments; nyc_supplemental_pois.geojson
    patches gaps in the Overture dataset), but the data model is static
    per-city files -- nyc_pois.geojson alone is 30.5 MB, ~116 MB across
    four cities. Nationwide requires replacing static assets with a
    viewport-driven service.
  - >
    Three named UI areas (search, layers, region handling) with no
    specification between them.

remedy: >
  Not a factory input in its current form. Split into a spike plus three
  scoped stories, and settle the perf target as a number, before any
  launch is considered.

