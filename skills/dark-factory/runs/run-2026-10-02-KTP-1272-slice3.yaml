improvements:
  - title: "Check the remote BEFORE the run, and treat a known outage window as a schedule input"
    detail: >
      workflow.js should run a cheap `git ls-remote` preflight at start and again before any
      push-dependent phase. If it 502s and the local clock is inside the documented Datasophia
      window (about 11 PM to 5 AM ET), the run must say so up front and plan around it rather than
      discover it at the end. On this run that single probe costs two seconds and changes the whole
      terminal state.
  - title: "Add PARKED_AWAITING_REMOTE as a non-terminal state with a bounded resume probe"
    detail: >
      A push that fails on 502 is not a halt. Introduce a state that keeps the run alive, writes the
      resume pointer, probes `git ls-remote` every 15 minutes up to a cap, pushes unpiped when the
      remote answers, and only then continues to QA. Distinguish it clearly from a real HALT in the
      telemetry so the two never get averaged together in the index.
  - title: "Arbitrate a Review finding that collides with an out-of-slice exclusion"
    detail: >
      Before Fix starts, intersect the findings against run-slice.json explicitly_out_of_slice. Any
      overlap must stop and surface the collision with both sides stated (the finding's severity and
      demonstration, the exclusion's stated reason), rather than letting Fix pick. If the run is
      unattended, the default should be to fix it AND raise the exclusion's named hazards as
      mandatory QA checks, never to quietly drop them.
  - title: "Commit the review's proof test onto the branch"
    detail: >
      Contract 5 should require the reviewer's demonstrating test to land as a tracked test-only
      commit on the ticket branch, not as an untracked file in a scratch worktree. The test that
      proves a CRITICAL is the only thing that can prove the fix. Here it survives only because
      somebody copied it into the ticket folder by hand.
  - title: "Require a Review re-pass before a fix phase may return PASS or partial"
    detail: >
      Fix-1 closed the only CRITICAL and then self-reported. The bounded fix loop should re-run the
      reviewer's named test_ref for every finding it claims to close, and record the observed output
      in findings.json. A finding stays open until its own test flips.
  - title: "Stop re-typing the last three retros and put them in workflow.js"
    detail: >
      Carried over, unimplemented, for the third run: per-AC TDD gating at each GREEN, the gate
      reading tdd/AC-<N>.md off disk and not only the returned JSON, the Implement AC ceiling, and
      automatic re-injection of runs/run-*-<TICKET>*.yaml into the concierge prompt. This run
      succeeded on all of them because a human applied them manually. Measure the gap: three runs of
      prose, zero lines of gate code.
  - title: "Carry an open grill item as a gate, not as a sentence in a markdown file"
    detail: >
      G12 has survived three runs because it lives in prose. An unresolved grill item should be
      written to a machine-readable open-items file in the ticket folder, re-injected into the next
      concierge prompt, and reported in telemetry until it is closed or explicitly dropped by a
      human.
  - title: "Fix the empty session_id, or stop pretending the session folder is the handoff target"
    detail: >
      Three runs have fallen back to the ticket folder because sessions/active/state.yaml has an
      empty session_id. Either resolve the session at run start, or make the ticket folder the
      declared primary target in contract 9 so the fallback is not reported as a degradation.

