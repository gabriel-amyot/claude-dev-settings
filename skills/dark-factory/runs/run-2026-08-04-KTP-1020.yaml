improvements:
  - title: "QA should auto-seed the known fixtures and screenshot the visual ACs (both themes) before halting PRESHIP for missing proof"
    detail: >
      KTP-1020 halted PARTIAL on 6 visual ACs while the fixture mechanism it needed was present and
      the run had already added tiered + reasoning fixture variants (app/api/media-plan/fixtures.ts,
      commit 363112f). The QA phase, when a visual AC is marked fixture:seedable, should start the
      local surface with the seeded variant, capture a light-theme and dark-theme screenshot per
      visual AC into the ticket design/screenshots/ folder, and only then decide PASS vs PARTIAL. A
      preship halt for proof the factory can generate itself is wasted human latency.
  - title: "Review phase must always write an artifact to review/, even on criticals:0"
    detail: >
      The review gate returned criticals:0 but left review/ empty, making the pass unauditable. Every
      review terminal (including zero-findings) must persist a review/report.md recording: files/
      diff reviewed, checks run (logic, contract, security, over-engineering), and the findings list
      (empty is fine, but explicit). A verdict with no artifact should be a workflow.js error, not an
      accepted PASS."
  - title: "Scope the QA typecheck to changed files, or attribute repo-wide pre-existing failures"
    detail: >
      qa/typecheck.out folded 9 pre-existing TS errors from 4 unrelated files into KTP-1020's QA
      signal. QA should run a changed-files typecheck (tsc on the branch's touched files / project
      references) for the ticket verdict, and separately record repo-wide pre-existing failures as an
      attributed 'not introduced by this ticket' note (per the CLAUDE.md pre-existing-failures rule).
      This keeps PARTIAL-vs-PASS honest and flags the repo debt without blaming the ticket.
  - title: "On HALT_PRESHIP, push the worktree branch to origin as a durable recovery point"
    detail: >
      HALT_PRESHIP leaves fully-committed work stranded in .worktrees/, one prune/clean from loss.
      The preship halt handler should push the branch to origin (no MR yet — that stays a human/
      main-loop step) so the 10 commits survive worktree cleanup and are recoverable by branch name.
      This matches the CLAUDE.md 'subagent outputs must be committed immediately' durability intent,
      extended to 'and pushed' for terminal halts that hold real code."
  - title: "Fix the empty session_id so retro handoffs land in a discoverable per-session prompts folder"
    detail: >
      Recurring across many prior runs (KTP-708 same day, KTP-1030, and earlier): sessions/active/
      state.yaml session_id is empty while the live id sits in current_focus. Repair the session-init/
      state-write step, or have Retro derive the session from current_focus, so handoffs are
      discoverable by /session:pickup instead of relying on the shared prompts/ fallback."

