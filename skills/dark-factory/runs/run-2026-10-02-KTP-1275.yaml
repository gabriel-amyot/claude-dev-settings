deductions:
  - points: 12
    score: task_confidence
    reason: >
      AC-1b carries a demonstrated, unfixed defect. fitFsa flies to cameraForBounds(..., {maxZoom:12})
      with no lower bound, so a large FSA (X0A, X0B, P0T) lands below the Canadian postal layer's z7
      reveal floor and the planner sees a bare basemap. Two independent probes reproduced it. The AC
      says "a Canadian postal query such as H4S", so the AC is not met for the general case.
  - points: 8
    score: task_confidence
    reason: >
      Every AC on this ticket carries an explicit screenshot evidence clause, and six of seven are
      visual_pending. No live render was captured for any of them. The ticket cannot be called done
      on compile plus unit assertions when the spec names the screenshots as the evidence.
  - points: 5
    score: task_confidence
    reason: >
      Three review findings remain open at the halt: the FSA_STAGE_ZOOM staging zoom that narrows
      rather than widens the query viewport, the info affordance that closes on click and is
      effectively unopenable on touch, and the Escape handler that closes the Audience panel while
      the planner is typing.
  - points: 4
    score: task_confidence
    reason: >
      AC-1 and AC-4 have no executable proof layer at all. Both are DOM, ARIA, CSS and event wiring,
      the repo ships no React component test runner, and the only machine signal behind them is that
      the project compiles. Their correctness is entirely unverified until the visual pass runs.
  - points: 3
    score: task_confidence
    reason: >
      No MR was created, nothing reached dev, and no deploy-side validation ran. The branch is pushed
      and in sync with origin, but the work is one unreviewed, unmerged branch.
  - points: 10
    score: factory_fitness
    reason: >
      The factory routed a ticket whose every AC is ac_kind visual to a headless QA socket that
      structurally cannot capture a screenshot. The PARTIAL was predictable from contract 0, not
      discovered at contract 6. No gate read the AC kinds up front and equipped a visual-capable
      tester (ui-probe) or declared the visual tail out of scope.
  - points: 8
    score: factory_fitness
    reason: >
      The fix loop is keyed on criticals_open. Review found a defect that is demonstrated by an
      executed failing probe and that falsifies a named AC, graded it MEDIUM, and the loop therefore
      never ran. Severity, not evidence strength, decided whether the factory fixed a proven bug.
  - points: 4
    score: factory_fitness
    reason: >
      Design closed at confidence 74 and review at 72, the two lowest numbers in the trace, and
      neither fed any gate. The soft confidence is recorded and then ignored. Design's 74 is exactly
      where the AC-1b defect entered.
  - points: 4
    score: factory_fitness
    reason: >
      Design did not reconcile the new fitFsa path against use-drill-down.ts, which already solves
      the same camera-fit problem with clampFitZoom and even carries the matching caveat comment at
      :226-231. The factory has no step that asks "does a sibling path in this repo already do this".
  - points: 3
    score: factory_fitness
    reason: >
      Review and QA each wrote their own uncommitted probe for the same fitFsa defect
      (review-fitfsa.test.ts and qa/qa-fitfsa-floor.probe.ts) and reported slightly different landing
