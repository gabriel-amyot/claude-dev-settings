  - "A review finding marked demonstrated:true with an executed failing probe, falsifying a named AC, was graded MEDIUM and so skipped the fix loop entirely."
  - "Two ACs (AC-1, AC-4) shipped with no executable proof layer. The compile is their only machine signal."
  - "Review and QA independently built two probes for the same defect and reported two different landing zooms (z5.32, z4.32)."
  - "Design confidence 74 and review confidence 72 are the run's lowest, and nothing consumed either number."
  - "The new fitFsa path reimplements a camera fit that use-drill-down.ts already solves correctly in the same component tree."
  - "sessions/active/state.yaml carries an empty session_id for the third consecutive run, so the handoff keeps falling back to the ticket folder."
  - "The run halted before the MR step, so a pushed 17-commit branch sits on origin with no MR and no reviewer."
  - "8 lint:types errors are pre-existing repo debt that every run has to re-explain in its gate notes."

improvements:
  - title: "Contract 0 must classify AC kinds and equip a visual-capable tester before Implement"
    detail: >
      The concierge already writes analyst/acs.json. Add an ac_kind field per AC and have workflow.js
      read it. If any AC is visual, the QA socket must be equipped with ui-probe (which reuses the
      authenticated Chrome session) instead of, or alongside, the headless subagent, OR the run must
      declare the visual tail explicitly out of scope at the front gate. A run whose every AC needs a
      screenshot should never reach contract 6 before anyone notices.
  - title: "Make the fix loop key on evidence, not only on severity"
    detail: >
      Change the gate predicate from criticals_open > 0 to criticals_open > 0 OR any finding with
      demonstrated == true AND a non-empty ac_ref. A finding backed by an executed failing probe that
      names an AC is a blocker regardless of the label the reviewer typed. KTP-1275's fitFsa defect
      satisfies both conditions and was still waved past the loop.
  - title: "Contract 2 (design) needs a sibling-path reuse question"
    detail: >
      Add one required output to the design contract: for each new function that moves a camera,
      fetches data or mutates shared map state, name the existing function in the repo that does the
      closest thing, and state why it is reused or why it is not. fitFsa versus
      use-drill-down.ts:268 clampFitZoom is the exact miss. One grep-backed line in the design would
      have cost nothing and saved the AC.
  - title: "Review probes must be handed to QA, not rebuilt"
    detail: >
      review/findings.json already carries test_ref with the probe path and command. Contract 6 should
      run the reviewer's probe verbatim and report its output, and only write a new probe when the
      reviewer's one does not execute. Two probes for one defect produced two different landing zooms
      and cost a QA cycle.
  - title: "Give the frontend belt a React component test runner, or stop accepting ACs that need one"
    detail: >
      AC-4 (focus, aria-expanded, Escape, popover) had no proof layer, and three of the four review
      findings are reasoned rather than executed for the same reason. Either add a component test
      runner to app-front-portal as a standing tool-belt task, or have the concierge flag any AC whose
      only proof would be a component render and route it to the visual pass up front.
  - title: "Consume the per-phase confidence numbers"
    detail: >
      Add a soft gate: if any phase closes below 75, the next phase's prompt must receive that phase's
      stated uncertainty as an explicit list of things to re-examine. Design closed at 74 with the
      camera-fit question open and Implement never saw that.
  - title: "Fix the empty session_id so handoffs stop falling back"
    detail: >
      Three consecutive runs (KTP-1272 x2, KTP-1275) resolved no active session and wrote the handoff
      into the ticket folder. Either make contract 9 call the session helper to resolve the slug, or
      drop the session path from the contract and make the ticket folder the documented primary
      location.
  - title: "Baseline the 8 pre-existing lint:types errors once"
    detail: >
      Record the three offending files in the frontend belt config so the gate can report
      "8 known-pre-existing, 0 new" automatically. Every frontend run currently spends review and QA
      prose re-establishing the same fact.

