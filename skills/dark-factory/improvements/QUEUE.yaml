- key: retry-idempotent-read-only-phases-once-before-ha
  theme: agent-null-dispatch
  status: open
  times_proposed: 6
  first_proposed: '2026-06-11'
  last_proposed: '2026-07-07'
  titles:
  - Retry idempotent read-only phases once before halting
  - Retry once on a null first-agent return before halting
  - Retry once on a null agent return before emitting HALT_AGENT_SKIPPED (recurring — top priority)
  detail: 'Concierge (and Grill) are read-only and idempotent. On a null agent() return at those phases,
    retry exactly once (with the same prompt, label suffixed ''-retry'') before emitting HALT_AGENT_SKIPPED.
    Bound it to one retry to respect the pipeline-retry circuit-breaker principle. This converts transient
    dispatch failures into normal runs at near-zero risk.

    '
