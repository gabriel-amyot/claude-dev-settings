  - phase: grill
    status: partial
    confidence: 73
    note: >
      The strongest artifact of the run. It ran two real JDK 21 probes against the real
      100.json corpus, proved the byte-offset slicer round-trips on all 42 slices, and pinned
      the failure mode (createParser(String) returns byte offset -1, so the slicer must be fed
