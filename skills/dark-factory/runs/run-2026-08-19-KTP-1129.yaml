improvements:
  - title: Give each open_question a blocking scope, and halt only on AC-blocking ones
    detail: >
      Extend CONCIERGE_SCHEMA's open_questions items with `blocks_acs: string[]` (AC ids, empty = blocks
      no AC) and `severity: 'blocking' | 'parkable'`. In dark-factory.workflow.js, fire the needs_human
      halt only when some question has a non-empty blocks_acs or severity 'blocking'. Parkable questions
      advance the pipeline: they go into decisionsNote as "PARKED, do not implement", into the ticket's
      "Open Questions / Deferred ACs" section, and into Gabriel's inbox. Q6 on this run is the exact
      test case: parkable, blocks_acs [], so KTP-1129 should have built its five ACs and shipped with
      Q3 explicitly deferred.
  - title: A question about a file's state must carry the reason that state exists
    detail: >
      Add to contracts/1-concierge.md: before raising any question about a file being untracked,
      ignored, missing, duplicated, or oddly placed, run the one command that explains WHY (git
      check-ignore -v <path>, git log -S '<path>' -- .gitignore, git log --diff-filter=D) and put that
      constraint plus 2-3 legal options INSIDE the question. A question whose obvious answer is illegal
      is not a finished question. This alone collapses this run's two gate rounds into one.
  - title: Stop losing ticket_folder on front-gate terminals
    detail: >
      In dark-factory.workflow.js, move `_tf = concierge.ticket_folder` to immediately after
      `rec('concierge', ...)`, and add `ticket_folder: concierge.ticket_folder` to the AWAITING_HUMAN,
      BLOCKED_NEEDS_HUMAN_AGAIN and BLOCKED_SPEC_QUALITY return objects. Retro should never search disk
      for a path the front gate already returned.
  - title: Mirror consumed answers to factory/decisions.yaml on every front-gate exit
    detail: >
      When the workflow exits at the front gate holding humanDecisions, write
      <ticket_folder>/factory/decisions.yaml as the YAML list of { id, question, answer } the headless
      re-entry already expects, copying question text verbatim (it is the staleness guard). Have
      contract 1 write the same file when it consumes interactive answers. Then a fresh cross-session
      run re-enters idempotently instead of re-asking five settled questions.
  - title: A second front-gate block should emit a gate handoff, not just a status
    detail: >
      On BLOCKED_NEEDS_HUMAN_AGAIN, reuse the headless GATE_REQUIRED payload: gate_of, decision_file,
      the decision_packet with ids and verbatim question text, and next_steps_for_caller. One shape for
      one event, and the human answers into a file that survives the session either way.
  - title: Front-gate hygiene finding becomes a parkable question, not a footnote
    detail: >
      When the concierge finds a live credential in a tracked file (this run: F5, a 64-hex operator
      capability token in a git-tracked project-management doc), it must raise a parkable open_question
      so the item reaches Gabriel's inbox. Today it lands in assumptions.json as a hygiene_note that
      only the next agent reads.
  - title: Raise a parkable scope question when the brownfield sweep is wider than the AC text
    detail: >
      F11 found 10 sites asserting a claim AC-5 names at 2, and 2 of the 10 are hard pins that break
      the build. The concierge parked that in prose. It should be a parkable open_question with a stated
      default ("sweep every site of the same claim; CHANGELOG excluded as historical"), so the wider
      scope is visible and vetoable without blocking the build.

