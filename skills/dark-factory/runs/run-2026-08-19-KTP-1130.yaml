improvements:
  - title: Apply the ticket_folder fix that is already written down
    detail: >
      In dark-factory.workflow.js, move `_tf = concierge.ticket_folder` from :541 to immediately after
      `rec('concierge', concierge, concierge.spec_quality)` at :491, and add
      `ticket_folder: concierge.ticket_folder` to the BLOCKED_SPEC_QUALITY (:531),
      BLOCKED_NEEDS_HUMAN_AGAIN and AWAITING_HUMAN return objects. This is a verbatim repeat of an
      improvement filed by the KTP-1129 retro on 2026-08-19. Two runs, two retros, two disk searches.
      Apply it before running the factory again.
  - title: Write a decision packet on EVERY front-gate block, not only the headless one
    detail: >
      Hoist the GATE_REQUIRED payload construction (workflow.js:512-519) above the interactive
      BLOCKED_SPEC_QUALITY and BLOCKED_NEEDS_HUMAN_AGAIN returns. On any front-gate terminal, write
      <ticket_folder>/factory/decisions.yaml as the list of { id, question, answer: null } using
      verbatim question text (the text is the staleness guard the resume path already relies on), and
      return decision_file plus the decision_packet in the terminal object. KTP-1130 would then re-enter
      by filling five answers in a file, instead of re-deriving Q1-Q5 from a prose Markdown page.
  - title: A spec_quality FAIL must leave the disk
    detail: >
      Add to contracts/1-concierge.md: on spec_quality FAIL, the concierge writes a
      general/inboxes/gabriel/pending/ item AND drafts a Jira comment through /post-comment for the
      ticket, listing each question with its evidence and its legal options. A conditional
      ("if answered on the ticket, post through /post-comment") is not an action. The project SOP is
      explicit that the phrase "needs input" must never exist in an on-disk artifact without a matching
      Jira comment, and this run produced five of them.
  - title: Ship a proposed spec repair with the rejection
    detail: >
      When spec_quality is FAIL and the ticket reporter is Gabriel himself (true here), the concierge
      should emit a ready-to-paste AC-LOCAL.md draft alongside the questions: AC-2 rewritten to the four
      names F1 verified, AC-5 split out to a follow-up ticket behind KTP-1127/KTP-1128, AC-3's seat
      clause reconciled to ADR-0001 in whichever of the two named directions is picked. That converts a
      dead-end block into one human read plus one approval. The evidence to write it was already
      gathered; only the draft is missing.
  - title: Cheap dependency precheck before spending a concierge pass
    detail: >
      Before dispatching contract 1, read the ticket folder's README.md and spec.md for a
      "Blocked by:"/"blocks" line and query the Jira issue links for open blockers. If a blocker is
      open, return BLOCKED_DEPENDENCY immediately with the blocker keys. This run had the answer in
      line 4 of its own spec and in its README, and still paid for a full gate pass to find it.
  - title: Keep confidence_deductions in the trace
    detail: >
      Change rec() at workflow.js:417 to push
      { phase, status, confidence, confidence_deductions: r?.confidence_deductions ?? [] } and pass the
      full array into the retro dispatch. Every phase prompt already demands the ledger. Discarding it
      makes each phase's self-score unauditable, which is exactly what the retro exists to audit.
  - title: Preflight the Klever dev nightly window for live-verify tickets
    detail: >
      When any AC proof requires a live dev endpoint, the concierge should check the clock against the
      documented Klever dev schedule (off after 20:00 EDT) before it starts, and either state up front
      that live legs are deferred to the next window or raise it as a parkable question. F8 was a
      predictable 000 at 22:45 EDT, and it silently downgraded F7 from "credential works" to "credential
      exists".
  - title: Family-level spec drift check for sibling tickets
    detail: >
      When a ticket names a sibling in the same family (here KTP-1127, KTP-1128, KTP-1129, KTP-1062),
      the concierge should diff the write/interaction model each one asserts. This run found by hand
      that AC-5's browser-Confirm model contradicts the direct-write apply_bid_change KTP-1129 shipped.
      That check should be a named step in contract 1, not a lucky read.

