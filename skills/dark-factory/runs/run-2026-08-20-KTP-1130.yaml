improvements:
  - title: Verify the push with git, never with a self-reported boolean
    detail: >
      In dark-factory.workflow.js, immediately after the Implement TDD gate and again inside
      preShipBlockers, run `git ls-remote --heads origin <impl.branch>` and compare the returned sha to
      the branch HEAD. Do not read impl.pushed. On an empty result or a sha mismatch, return
      HALT_NOT_PUSHED with the raw ls-remote output and the local sha. This run advanced through Review
      and QA — two full phases, both of which depend on the push — with zero commits on origin. This is
      the highest-value fix on the list and it is one command.
  - title: A failed fetch in Review or QA is 'stuck', not a fallback
    detail: >
      Contracts 5-review.md and 6-qa.md both say "run 'git fetch origin <branch>' then 'git checkout
      <branch>'". Add an explicit clause: if that fetch fails for any reason, return status 'stuck'
      with the git error verbatim and do NOT substitute a local ref, a local worktree, or a detached
      checkout. QA did substitute, documented the 502 honestly in a YAML comment, and produced excellent
      work — but the segregation guarantee the whole review/QA split exists to provide was gone and
      nothing could tell.
  - title: Escalate the fix loop to a demonstrated HIGH that names an AC
    detail: >
      The loop condition at workflow.js is `while (review.criticals_open > 0 && fixRounds < MAX_FIX_ROUNDS)`.
      Widen it: enter the loop for any finding with demonstrated:true whose title or detail references an
      AC id, regardless of severity. This run's halt cause was review finding 1 — HIGH, demonstrated with
      an executable probe, with suggested_fix naming media_api.py:163 as the raise site. The factory had
      the diagnosis and the prescription and no path from one to the other. Keep MAX_FIX_ROUNDS at 2 so a
      persistent gap still halts.
  - title: Preflight the proof tooling each AC names, before Implement
    detail: >
      Add a step to contract 1 (or a workflow pre-Implement probe): for every AC, extract the commands
      its Then clause names and check their prerequisites. `op whoami` for any 1Password-backed value, a
      HEAD request for any live endpoint, `gitleaks version`, `mcpb --version`. Return each as
      available/unavailable with the error, and pre-classify the affected AC as PARTIAL in the plan
      rather than discovering it at the end of QA. AC-3 of this run was unpassable from commit one and
      the run found out after the full build.
  - title: Apply the two workflow.js fixes now filed by three retros
    detail: >
      (a) rec() at :417 becomes
      `trace.push({ phase: name, status: ..., confidence: r ? r.confidence : null, confidence_deductions: (r && r.confidence_deductions) || [] })`
      and the retro dispatch passes the full array. Six phases this run declared 128 points of
      self-doubt and not one is recoverable, which makes the retro unable to audit the self-assessment
      it exists to audit. (b) move `_tf = concierge.ticket_folder` from :541 to just after the
      concierge rec() at :491 and add `ticket_folder: concierge.ticket_folder` to the
      BLOCKED_SPEC_QUALITY (:531), BLOCKED_NEEDS_HUMAN_AGAIN and AWAITING_HUMAN returns. Both were
      filed on 2026-08-19 by the KTP-1129 retro and again by the KTP-1130 retro the same day.
  - title: Refuse to start a live-verify ticket inside the dev shutdown window
    detail: >
      Klever dev is off after 20:00 EDT (documented in the bibliotheque SOP). Before dispatch, if any
      AC's proof names a *.dev.beklever.com endpoint and the local clock is inside the window, either
      park the run until the next window or state up front, in the plan, which legs are deferred and
      why. Two runs of this ticket, two HTTP 000s on the same AC-4 leg, and yesterday's retro already
      filed this.
  - title: Make the ticket front loader a contract deliverable
    detail: >
      Add a step to contract 6 (or a workflow post-QA write): update
      <ticket_folder>/STATUS_SNAPSHOT.yaml with status, branch, head sha, commit count and the per-AC
      verdict lifted from qa/result.yaml. The project CLAUDE.md tells every agent to read
      README.md then STATUS_SNAPSHOT.yaml FIRST. This one still says "no build started" beside a
      finished build, so the next session's first read is actively misleading.
  - title: A HALT terminal must leave the disk
