summary: >
  A technically clean build halted correctly at pre-ship. The TDD gate ran in halt mode with zero
  warn-mode violations and QA re-verified every RED against git, which is the strongest TDD evidence
  the factory has carried. The two failures are both factory design, not implementor error: a ticket
  whose every AC is visual was handed to a QA socket that cannot render, and a defect proven by an
  executed failing probe was graded MEDIUM and so never reached the fix loop.
