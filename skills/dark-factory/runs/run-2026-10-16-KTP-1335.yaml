improvements:
  - title: "Write phase artifacts to the main project-management path, never a worktree"
    detail: >
      In workflow.js, resolve the ticket folder as the absolute main-checkout path and pass it to
      every phase. Never run project-management phases with isolation worktree. Add a ship-prep
      gate that fails when tdd/, review/findings.json or qa/result.yaml is missing under the main
      ticket folder.
  - title: "Sprint-factory merge-order gate for blocked tickets"
    detail: >
      When a ticket has an unmerged blocker, ship-prep must emit READY_TO_SHIP_HOLD_FOR with the
      blocker key, and the main loop must not merge the MR until the blocker is merged to dev.
      Alternatively, hold tier-2 dispatch until the tier-1 MR merges.
  - title: "Cross-repo contract test in QA when both branches exist"
    detail: >
      Contract 6 should run the dependent backend branch locally (KTP-1334) and send one real
      envelope through it when both sides are pushed. Record a recorder-only result as PARTIAL, not PASS.
  - title: "Implement gate runs eslint on changed files before the last GREEN"
    detail: >
      Add eslint on changed files (and tsc against an origin/dev baseline) to the implement exit
      gate for the frontend belt, so lint fixes do not need a separate commit after implement.
  - title: "Design contract reads the repo lib/ conventions list"
    detail: >
      Contract 2 should grep for existing directive and env-read patterns (use server-only,
      per-request process.env reads) before it proposes a new import or a module-level default.
  - title: "Flag GREEN commits that change RED assertions"
    detail: >
      The TDD gate should diff the test files between the RED and GREEN commits and require a
      written reason in tdd/AC-N.md for any changed expected value.
  - title: "Give soft confidence a rubric"
    detail: >
      Each phase contract should state what lowers confidence (unverified items, workarounds,
      deferred checks) so the number carries signal.
