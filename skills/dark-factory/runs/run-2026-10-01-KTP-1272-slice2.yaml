improvements:
  - title: "Gate each AC at its GREEN, not the whole pass at the end"
    detail: >
      In workflow.js, run tddViolations on the single AC the agent just reported, at each GREEN,
      instead of only on the full ac_tdd array after Implement returns. A missing RED then halts one
      AC at a cost of one commit, with the agent's context still warm. On this run that converts a
      HALT_TDD_GATE into a 60-second correction at 23:20. Keep the end-of-pass completeness check as
      a backstop.
  - title: "Give a genuine missing-RED one bounded RED-repair bounce"
    detail: >
      Add a sibling to the ledger-repair retry: when the ONLY violations are missing-RED on ACs that
      already have GREEN code, bounce once to a repair agent with the worktree and a single
      instruction — revert the GREEN hunks for that AC in a scratch checkout, write and run the
      failing test, commit it as a test-only RED BEFORE the existing GREEN, then re-gate. It must
      fail honestly if the test cannot be made to fail for the right reason. This is strictly
      narrower than a full Implement re-run and preserves the gate's teeth.
  - title: "Make the gate read the disk ledger, not just the JSON"
    detail: >
      tddViolations should require that tdd/AC-<N>.md exists for every non-exempt entry and that it
      names the RED and GREEN shas. A returned ac_tdd entry with no file is a violation. This run
      would have surfaced the gap at AC-2, five commits earlier, and the recovery save point
      promised by CLAUDE.md would actually exist.
  - title: "Cap the Implement slice in code, not in the handoff"
    detail: >
      Carry over unimplemented from run 1. workflow.js should refuse an Implement slice above the
      2-3 AC ceiling unless the concierge supplies an explicit split, and a granted raise should
      force sequential sub-agents of at most five ACs each. Run 1 took 20 ACs and died; run 2 took
      four and nearly cleared. The evidence for this rule is now two runs deep on one ticket.
  - title: "Front-load the runtime-proof ACs inside the slice"
    detail: >
      AC-4 and AC-8 were step 4 of 4 in a slice that already put integration first. They still ended
      up last and still ended up the weakest. The plan contract should order any AC requiring a
      running app ahead of the pure-function ACs that depend on the same design, so a failed timing
      budget invalidates the design early rather than at the end.
  - title: "Add an explicit infra commit class"
    detail: >
      Contract 4 should name a fourth commit prefix for test-harness work that belongs to no AC
      (here: the wiring-gate extension and the TypeScript suite runner), and the gate should ignore
      it. Without a slot, honest infra work either looks like noise or gets mislabelled onto an AC.
  - title: "Re-inject the previous retro automatically when a ticket re-enters the factory"
    detail: >
      On start, workflow.js should look for runs/run-*-<TICKET>*.yaml and paste the prior run's red
      flags and improvements into the concierge prompt. On this run a careful human did that by
      hand through SESSION_STATE.md. The next ticket may not get one.
  - title: "Require a GREEN commit at HEAD before Review"
    detail: >
      An exit check that HEAD is a GREEN or infra commit, never a RED. Run 1 halted on a RED HEAD;
      run 2 halted on unlabelled infra. Neither is a state another session should resume from
      blind.

