improvements:
  - title: "Make a demonstrated finding blocking, whatever its severity label"
    detail: >
      In contract 7, a finding with demonstrated true and a failing test_ref must enter the fix loop
      regardless of severity. LOW should describe user impact, never whether the factory acts. This single
      rule turns the present run from HALT_PRESHIP into READY_TO_SHIP, because the fix is one line.
  - title: "Gate the VERIFIED stamp on an executed check"
    detail: >
      A sentence carrying [VERIFIED against <repo>@<sha>] must name a command or a test that was run at
      that sha. Contract 5 should refuse to emit a stamp without one, and QA should fail any AC whose
      deliverable is a stamped document when a stamp has no execution behind it.
  - title: "Replace the RED exemption with a claim check for doc-shaped ACs"
    detail: >
      When an AC's diff is documentation, require a claim-extraction test instead of accepting exempt. The
      contract page lists its claims, a test asserts each one against the code at the branch head. The
      reviewer wrote exactly such a test by hand this run, which proves it is cheap.
  - title: "Commit the reviewer's demonstration test instead of parking it as .evidence"
    detail: >
      Contract 7 should require a demonstrated finding's test to land on the branch, red, and to turn green
      in the fix loop. Keep the .evidence copy only when the test cannot compile on the branch.
  - title: "Boot-check any new test harness during design, before grill"
    detail: >
      Contract 2 should require that a new SpringBootTest or integration harness is started once, with its
      full constructor bean list enumerated from the class under test, before the plan is handed on. Grill
      found a missing EnableAutoConfiguration, a credentials dependency that would be green locally and red
      in CI, and two missing beans. All three are mechanical to detect.
  - title: "Pin the QA toolchain to the pom's declared release"
    detail: >
      Contract 8 should read maven.compiler.source or maven.compiler.release and refuse a JDK that does not
      match, or record the mismatch as an explicit finding. The repo CLAUDE.md already documents a JDK 21
      Lombok break, so the divergence is known and still went unflagged.
  - title: "Surface a first-of-its-kind pattern as a human decision"
    detail: >
      When a branch introduces the first instance of a pattern the repo has zero of, such as the first
      SpringBootTest here, the concierge or review phase should name it in the ship notes. Absence at that
      scale is usually a past decision, not an oversight.

summary: >
  A strong run that halted on a one-line defect. Three ACs built, 817 tests green, PMD clean on every
  changed file, both testable ACs carrying genuine test-only RED commits, and the branch pushed. The halt
  is correct but avoidable: the reviewer demonstrated the Cache-Control gap with a failing test, labelled
  it LOW, and the fix loop never ran, so QA found the same fact again and stopped the line.
