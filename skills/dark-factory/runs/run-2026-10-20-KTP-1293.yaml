improvements:
  - title: "BLOCKED_SPEC_QUALITY must produce a Jira comment, not just disk artifacts"
    detail: >
      Contract 1 should, on a spec FAIL, write the blocking questions as a draft and route it
      through /post-comment to the Jira ticket, plus a file under
      general/inboxes/gabriel/pending/. workflow.js should refuse the BLOCKED_SPEC_QUALITY terminal
      state until both a questions artifact and a posted-or-drafted PO surface exist.
  - title: "Emit questions.json whenever an artifact cites a question id"
    detail: >
      Add analyst/questions.json to the concierge output schema with fields
      {id, question, options, blocks_ac, decision_owner}. Validate that every Q<n> string appearing
      in any analyst artifact resolves to an id in that file. Here Q2 dangles.
  - title: "On spec FAIL, draft the AC-LOCAL.md instead of only diagnosing"
    detail: >
      The concierge already knows which ACs are buildable, blocked, or false-premised. It should
      write a proposed AC-LOCAL.md to the ticket folder with the rewritten ACs, the dropped ones, and
      a header stating the divergence from Jira. That turns a dead halt into a one-human-decision
      restart. Marked clearly as a proposal, never auto-adopted.
  - title: "Gate an AC that contradicts a pinned invariant as a named terminal reason"
    detail: >
      AC-3 collides with safety invariant A5. Add a distinct terminal status
      BLOCKED_INVARIANT_CONFLICT carrying {invariant_id, file, pinning_test, ac_id}, so the miner can
      separate a vague spec from a genuine architecture decision. The two need different humans.
  - title: "Preflight sync gate on the primary repo"
    detail: >
      The concierge should run git fetch then git rev-list --count HEAD..origin/<default> and record
      it. Above zero, every artifact fact must be stamped as read from origin/<default>. Halt if any
      fact cites the local tree. Here the analyst did this by hand at 123 commits behind.
  - title: "Resolve the active session from the ledger, not state.yaml"
    detail: >
      Repeat of the GH-343 finding, still unfixed. Contract 9 should query ledger --org klever for
      the launching session and use its prompts folder. Fall back to the ticket reports folder only
      after the ledger lookup fails.
  - title: "Flag fixtures that disagree with the recorded vendor schema"
    detail: >
      tests/conftest.py:418 uses America/New_York while the committed TTD schema dump describes
      Campaign.timeZone as a Windows time zone ID. The concierge should report a fixture-vs-schema
      mismatch as a blocking finding, because such a fixture lets a wrong implementation go green.

summary: >
  The front gate worked. KTP-1293 was stopped at concierge with evidence-stamped proof that one AC
