improvements:
  - title: "Give the factory an autonomous fixture-render QA lane for ac_kind=visual"
    detail: >
      Contract 6 (QA) currently punts every visual AC to human ui-probe because ui-probe needs Gab's
      authenticated Chrome, which a headless run cannot drive. But a pure-render transform (like this
      markdown swap) can be proven autonomously: spin the local dev server (or a Playwright
      component/route mount), inject a fixture insight whose insightText contains `**bold**` and
      `- item`, navigate /home, and assert the rendered DOM contains <strong>/<li> and NO literal
      `**` or leading `- ` in visible text. That needs neither dev nor Gab's Chrome. Add this lane so
      visual/pure-render ACs get a DOM-level PASS and NEEDS_VISUAL_VERIFY is reserved for genuinely
      pixel/UX-judgment ACs, not transforms a fixture can prove.
  - title: "Propagate grill parked-notes into a structured QA checklist"
    detail: >
      The grill produced actionable QA items (N2: eyeball a multi-paragraph blurb for the dropped
      inter-paragraph gap). These lived as prose in design/grill-report.md and never reached QA.
      Contract 3 (grill) should emit a machine-readable qa_checklist[] (each item: what to verify,
      why, blocking?) that Contract 6 (QA) is required to tick through and record a result for.
      Parked notes that vanish between phases are the failure mode.
  - title: "QA gate should triage typecheck/lint failures against the changed file set"
    detail: >
      Contract 6 runs lint:types and got 9 errors here, ALL pre-existing on origin/dev and none in
      the branch's one changed file. The gate should diff failing files against
      `git diff --name-only origin/dev...HEAD` and annotate each MINE (regression, blocks) vs
      PRE-EXISTING (repo debt, does not block). A raw wall of tsc red forces manual proof and risks a
      false halt or a missed real regression. (Third run in a row — KTP-792 x2, now KTP-1015 — with
      the same untriaged pre-existing-typecheck noise; worth fixing upstream, not re-flagging.)
  - title: "Worktree hygiene: fresh npm ci, never symlink node_modules from a behind checkout"
    detail: >
      Implement's first dev-boot failed because node_modules was symlinked from the main checkout
      (9 commits behind), producing `Cannot find module 'next/dist/pages/_app'`. The concierge/build
      setup for a frontend belt should always run a clean `npm ci` inside the worktree and never
      reuse a symlinked node_modules from a stale main checkout. Cheap to enforce, removes a recurring
      wasted retry.
  - title: "Write a review artifact even when criticals:0"
    detail: >
      Contract 5 (review) left only diff.patch in review/. It should always drop
      review/review-report.md (what was checked, the criticals:0 verdict, any non-blocking nits) so
      the pass is reconstructable on disk, not trace-only. Recurring across runs.

