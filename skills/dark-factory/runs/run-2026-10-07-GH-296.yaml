improvements:
  - title: Split the terminal taxonomy so a pushed, green branch is not a HALT
    detail: >
      Add READY_FOR_MR as a distinct terminal state. The predicate is mechanical and cheap: worktree
      clean, git ls-remote shows the branch at HEAD, QA overall ALL_PASS, criticals_open 0. When it
      holds, the run ends READY_FOR_MR and the main loop opens the merge request. Only when the
      predicate fails is it a HALT. Today GH-296 (remote up, pushed, green) and GH-231 (remote 502,
      nothing pushed) carry the same label, which makes the run index useless as a signal.
  - title: Make the ship phase own the version bump and verify the CHANGELOG against measured output
    detail: >
      Contract 7 never ran and implement did its job instead, so nothing checked the CHANGELOG. Add
      a ship gate that (a) refuses to pass when the version bump commit is not the contract 7 commit,
      and (b) requires every numeric claim in the new CHANGELOG entry to cite a file under qa/. Here
      the entry says "0 after" and qa/full-suite-isolated.out says "1 skipped" on the same line of
      output. That is a diff a script can make, not a judgement call.
  - title: Give a non-blocking review finding an owner before any terminal state
    detail: >
      Third filing. Add a carry_forward outcome alongside blocking. Before a terminal state, every
      finding in review/findings.json must close by a commit sha, by a filed follow-up issue under
      the parent map, or by a one-line waiver recorded in the telemetry. This run would then have
      forced a decision on four findings instead of shipping all four. Two of them (the CHANGELOG
      number and the app version string) are one-line fixes.
  - title: Make a finding that contradicts a shipped artifact's own measurement blocking
    detail: >
      Narrower and sharper than the general carry_forward rule. If a finding shows that a file this
      branch wrote states a number that this branch's own QA output contradicts, that is blocking
      regardless of severity. A wrong CHANGELOG is not code quality, it is the repo's record of the
      change being false.
  - title: Require factory/decisions.yaml before design may start
    detail: >
      The concierge authorised deleting POST /sync and moving /readyz. That authorisation exists only
      as prose inside design/grill-report.md. Make the concierge write factory/decisions.yaml with
      one object per question (id, question, answer, evidence, fallback) and make the design gate
      refuse to start without it. The MR body and the retro both read from that file.
  - title: Forbid an ephemeral path as the only home for review and QA evidence
    detail: >
      Review used /tmp/sfout-review-296 and QA used /tmp/qa-gh296. Both are gone. The evidence lives
      only because both phases volunteered to copy it out. Require phase worktrees under
      .worktrees/<TICKET>-<phase>, and have the phase gate rewrite every reproduction command in its
      result file to a path that still exists at retro time.
  - title: Flag a test that can only pass where its failure mode is impossible
    detail: >
      The anti-drift guard skips wherever vendoring is actually needed, which is CI and every bare
      clone. A test that is skipped in the only environment that matters is worse than no test,
      because the suite count says it exists. Add a QA check: any test added by the branch that
      skips in the isolated run must be named in the result file with a reason, and a skip whose
      reason is "the condition this guards cannot occur here" is a finding.
  - title: Fix the empty session_id or delete the session-folder branch of contract 9
    detail: >
      Sixth consecutive run. sessions/active/state.yaml has an empty session_id and the ledger names
      a folder that is not on disk. Either populate it at session init or simplify contract 9 to
      write the handoff to the ticket folder unconditionally. The current rule has a primary path
      that has never once worked.

what_went_right:
  - >
    QA re-ran the whole suite in a detached worktree under /tmp specifically because AC-8's claim is
    about what happens when a project-management checkout is NOT an ancestor. Measuring that in tree
    would have been meaningless, and the phase understood why.
  - >
    Review re-proved AC-3 and AC-4 by raising ContractError at the real contract validator and
    ConfigError inside the real build_client factory, not through the suite's gateway injection.
    That tests the wiring, not just the taxonomy, and it is what a sceptical human would have asked for.
  - >
    The AC-3 inversion was demonstrated on a live uvicorn process: the identical payload returns 200
    at the push door and 400 at the REST door. Two retry contracts, one call path, proven at runtime
    rather than argued.
  - >
    The grill re-measured the skip split independently and found the ISSUE text wrong by one file.
    It then verified both DAC premises by grepping the real terraform, confirming the startup probe
    is pinned to /healthz and that no deployed contract references /readyz or /sync.
  - >
    Every RED commit was re-verified by QA against three conditions, and the one irregularity
    (AC-5's import stub needing its own earlier commit) was recorded rather than smoothed over.
  - >
    The implement phase refactored first, separating the submission call from the status translation
    in two commits before touching any AC. Three status policies over one submission path is the
    right shape and it got its own ADR draft.
  - >
    QA derived the four LOW findings independently instead of copying review's list, and the two
    lists agree. That is a real cross-check, not a rubber stamp.

