improvements:
  - title: Cap the Implement slice, or force a checkpoint agent per N ACs
    detail: >
      workflow.js should refuse an Implement phase whose slice exceeds the AC ceiling unless the
      concierge supplies an explicit split. When a raise is granted, the gate must split Implement
      into sequential sub-agents of <= 5 ACs, each handing the next a one-page state note. KTP-1272
      ran 20 in one agent and lost the last 6 plus all integration.
  - title: Push after every GREEN, not at the end of the phase
    detail: >
      Add a post-GREEN hook in the TDD loop running `git push -u origin <branch>` unpiped. A halt
      then leaves a remote branch another session can pick up. Today a HALT_AGENT_SKIPPED leaves the
      work reachable only from one machine's .worktrees/ directory.
  - title: Make an integration AC the FIRST build step, not the last
    detail: >
      Reorder the plan contract so the mount/wire step (component rendered in the real shell, the
      new mechanism called from one real hook) is step 1, with the pure-function ACs built behind
      it. A thin vertical slice first means a halt leaves something that works.
  - title: Gate on "every new module has a non-test call site"
    detail: >
      Add a code gate before Implement reports PASS: for each new source file, grep for an importer
      outside __tests__/. KTP-1272 would have failed it on 13 of 13 new files. This is the check
      that would have caught the integration gap at the phase boundary instead of in the retro.
  - title: A `partial` grill must block Implement until its CRITICAL items are resolved
    detail: >
      Contract 3 should emit `critical_findings[]`. workflow.js blocks the Implement phase while any
      is unresolved, and the resolution has to be written into AC-LOCAL.md or the plan. G1 and G2
      were CRITICAL, correct, and ignored.
  - title: Write the tdd/ ledger as the loop runs, not at phase end
    detail: >
      One file per AC appended at each STUB/RED/GREEN transition. The retro for this run had to
      rebuild AC coverage from `git log --format=%s`, which only worked because the commit subjects
      happened to name their ACs.
  - title: Require a clean worktree at every phase exit
    detail: >
      Exit-check `git status --porcelain` is empty. The halt left 225 uncommitted lines in
      style-contrast.ts and an untracked scratch-contrast-check.ts, both of which die silently.
  - title: Front-load the runtime-proof ACs that need a human or a dev server
    detail: >
      AC-4 (zero network requests) and AC-8 (400 ms, 10/10 runs) plus the grill's G8/G9 unverified
      assumptions all need a running app. Schedule them early: if the budget misses, the whole
      styleEpoch design changes, and discovering that at AC-20 wastes the run.

