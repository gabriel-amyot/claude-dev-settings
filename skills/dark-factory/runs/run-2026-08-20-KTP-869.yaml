improvements:
  - title: Gate the review phase on HIGH, not only CRITICAL, when the finding is demonstrated
    detail: >
      In workflow.js, change the review gate predicate from `criticals_open == 0` to
      `criticals_open == 0 AND (count of findings where severity == HIGH and demonstrated == true)
      == 0`. A HIGH with `demonstrated: true` carries a failing test, so it is a fact, not an
      opinion, and it should enter the bounded fix loop exactly like a CRITICAL. Keep undemonstrated
      HIGHs non-blocking so the gate cannot be tripped by rhetoric. This run is the case for it:
      3 demonstrated HIGHs, 0 fix commits, and one of them a proven escaping gap on the money path.
  - title: Add a reconcile step between review and QA that forbids PASS on an AC with an open demonstrated finding
    detail: >
      Contract 7 (QA) should read review/findings.json, map each finding to the AC its file touches,
      and refuse to record PASS for any AC carrying an open finding with `demonstrated: true`. The
      minimum verdict in that case is PARTIAL with the finding quoted in the gap field. Right now
      QA's review_artifact_spotcheck only asserts the file is non-empty and that the suite baseline
      matches, which is why AC-1 and AC-2 came back PASS with failing probes against them. Schema
      change: add `blocked_by_review_finding: [ids]` to each per_ac entry.
  - title: Make the terminal report the union of all open gaps, not just QA's own findings
    detail: >
      preShipBlockers should build `partial_cause` by unioning QA's gap with every open review
      finding, deduplicated by AC. The human reading this halt sees seven input-validation surfaces
      and does not see that the write path has no attribution at all, which is the more serious half
      of the same AC. Ranking matters too: sort the union by blast radius so the money path leads.
  - title: Reclassify unescaped or unbounded caller-facing output as CRITICAL in the review severity rubric
    detail: >
      Add an explicit rule to contract 6's prompt: a new server-supplied string that reaches the
      caller without the repo's established sanitiser is CRITICAL, not HIGH, when the field informs
      a money decision. The escaping class is the one where "demonstrated but low probability"
      reasoning is most tempting and most wrong — the precondition (a compromised upstream or an
      intercepting proxy) is exactly the threat model the sanitiser was written against, so citing
      it as mitigation inverts the argument.
  - title: Promote review and QA probe tests into the repo suite before the terminal state
    detail: >
      ShipPrep and the halt path should both copy review/probes/*.py and QA's gap probes into
      tests/ as xfail (pytest.mark.xfail(strict=True)) for every gap that is real and open. The gap
      then has a name in the suite, un-xfailing it is the definition of done for the follow-up
      ticket, and a later run cannot silently reintroduce it. Today the suite is 496 green with
      three demonstrated HIGHs open, so the suite actively misrepresents the tree.
  - title: Make the ticket artifact tree a mechanical gate, not a convention
    detail: >
      Add a scripted check at the end of implement: STATUS_SNAPSHOT.yaml exists and its status
      matches the run state, jira/ac/ is populated from AC-LOCAL.md, and every non-empty phase has
      written into its reports/ subdirectory. Fail the phase if not. This was improvement #1 out of
      the KTP-1130 retro one day earlier and it did not take, which means it needs to be code rather
      than prose in a contract.
  - title: Route parked open questions and gate rulings to Jira on the halt path, not only on ship
    detail: >
      HALT_PRESHIP currently posts nothing, so a run that generates decisions worth recording
      leaves them all on disk. The halt path should draft one Jira comment (through /post-comment,
      as the rules require) carrying the AC-5 gap, the four gate rulings and Q3's parked question,
      and should commit the draft ADRs. Project CLAUDE.md names disk-only parking as the exact
      failure mode: "the phrase 'needs PO input' must never exist in an on-disk artifact without a
      matching Jira comment."
  - title: Add a mechanical doc-line-ref check to the release commit
    detail: >
      A short script over agent-os/**/*.md that extracts every `path:line` reference and asserts the
      named symbol is within a few lines of the target at HEAD. This run drifted 12 refs by 13 to 20
      lines on the page that calls a stale shape a defect. It is a LOW finding that a 20-line script
      removes permanently, and it costs a reviewer's attention every run.
  - title: Keep the concierge's stale-checkout note but make it an action
    detail: >
      The gate correctly recorded that the main checkout was 101 commits behind origin/dev with 21
      staged files, and correctly called it non-blocking because every phase worked in its own
      worktree. Go one step further: emit it as an inbox item for Gabriel rather than only an
      assumptions.json line, since a stale-plus-dirty main checkout is the precondition for the
      fetch-before-read and deploy-identity failures the global CLAUDE.md documents.

what_went_right:
  - >
    The best TDD evidence of any run so far. All five REDs independently re-verified by QA in
    QA-owned worktrees, test-only commits confirmed by git show --stat, assertion failures rather
    than import errors, and four of five test files byte-identical between RED and tip so no test
    could have been swapped.
  - >
    QA refused to inherit the implementor's proof. It cut its own worktrees, wrote its own protocol
    probes, and re-derived the AC-1 golden schemas from an untouched origin/dev tree to prove the
    pin was not self-referential.
  - >
    QA self-corrected twice, visibly: it tightened its own weak AC-3 assertion before recording
    PASS, and it withdrew a serverInfo.version mismatch after tracing 3.4.7 to the pinned fastmcp
    version in uv.lock. Both are written into result.yaml rather than quietly dropped.
  - >
    Review demonstrated rather than asserted. Four of five findings carry a failing test, and the
    escaping finding was proven reachable through a raw HTTP/1.1 server and a real httpx client
    instead of being argued from the source.
  - >
    The grill measured the baseline instead of trusting it, closing a false 285-test figure that
    was a `def test_` line count, and caught two specification defects that would have turned
    listed baseline tests red.
  - >
    The front gate paid for itself across two runs. Run 1 halted on four real decisions, Gabriel
    answered them, and Q1's answer reordered the work so the media-api change landed first — which
    is the only reason AC-1 was buildable at all.
  - >
    The branch is pushed, the version bumped correctly to a minor, the changelog written, and the
    out-of-scope bundle script left untouched exactly as Q3 ruled.

