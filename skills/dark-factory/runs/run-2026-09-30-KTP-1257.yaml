improvements:
  - title: "Fix loop must clear DEMONSTRATED findings at any severity, not just CRITICAL"
    detail: >
      In workflow.js, change the fix-loop entry predicate from severity == CRITICAL to
      (severity == CRITICAL) OR (demonstrated == true). A finding with a reproducible failing probe
      is a fact about the branch, not an opinion about it. review-2 must not be allowed to report a
      clean gate while any demonstrated finding is unresolved; make the review contract emit
      demonstrated_open alongside criticals_open, and gate on both.
  - title: "Promote every demonstrated review probe into the branch's test suite"
    detail: >
      Contract 7 (fix) should require that each demonstrated probe is moved from review/probes/ into
      src/test and committed, either green (fixed) or documented as a known-fail waiver signed at the
      ticket level. Add a gate: the QA phase fails if any file under review/probes/ has no
      counterpart under src/test. This alone would have turned the KTP-1257 HIGH into a build-visible
      red before QA.
  - title: "Add a deliverable-manifest gate for non-code ACs"
    detail: >
      The design phase should write factory/deliverables.yaml listing every AC's concrete artifact
      (file path + a grep assertion for doc ACs). Add a JS gate before review that runs each
      assertion and blocks on a missing artifact. AC-C would have failed at implement, not at QA,
      costing minutes instead of a HALT.
  - title: "Require one non-mocked-client test on every outbound HTTP path"
    detail: >
      Add a java-belt rule to contract 5/6: when a diff introduces or changes a class that calls
      RestTemplate/WebClient, at least one test must use MockRestServiceServer or a real client
      against a local stub, asserting the requested URI string. A full-mock suite on an HTTP client
      proves the mock, not the code.
  - title: "Make review/findings.json single-source and mutated by the fix phase"
    detail: >
      Contract 7 must rewrite findings.json in place, setting per-finding status (fixed / open /
      waived) and recomputing criticals_open and demonstrated_open. Add a consistency gate that the
      counts in findings.json match the phase trace before QA runs.
  - title: "Spend the live fixture when the concierge names one"
    detail: >
      When factory/decisions.yaml records an available live fixture, contract 8 (QA) should require
      at least one probe against it, or an explicit skip reason. KTP-1257 named screen 303989021 and
      network 3425 and never called them, so the casing trap that burned KTP-791 is still only
      unit-proven.
  - title: "Escalate on low phase confidence instead of only on gate status"
    detail: >
      No phase in this run cleared 88 and review sat at 78, yet nothing changed strategy. Add a soft
      rule to workflow.js: a phase confidence below 80 forces an extra adversarial pass on that
      phase's output before advancing. This is the roadmap item in contract 9 and this run is the
      case for it.

summary: >
  KTP-1257's backend slice landed 3 of 5 ACs on genuine RED-verified TDD proof with a clean PMD
  scan, then halted pre-ship on two escapes: a demonstrated image-proxy URI-template defect that
  review-2 waved through because it was HIGH and not CRITICAL, and a documentation contract AC that
  no phase before QA ever checked for existence. The TDD gate ran in halt mode with zero violations,
  so the run's proof is trustworthy; the fitness loss is in the fix loop's severity blindness and
  the absence of a deliverable-existence gate.
